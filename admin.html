<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0B1119">
<title>Admin panel — RAYIS BOZORI</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>
<style>
:root{--bg:#0B1119;--surf:#151C26;--surf2:#1E2733;--brd:#2A3441;--tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;--pri:#10B981;--pri2:#34D399;--priS:#064E3B;--acc:#3B82F6;--accS:#1E3A8A;--er:#EF4444;--wn:#F59E0B;--pu:#8B5CF6;--r1:8px;--r2:12px;--r3:16px;--r4:24px;--safe-b:env(safe-area-inset-bottom,0px)}
[data-t="light"]{--bg:#F5F7FA;--surf:#FFFFFF;--surf2:#EEF2F7;--brd:#E2E8F0;--tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;--pri:#059669;--pri2:#10B981;--priS:#ECFDF5;--acc:#2563EB;--accS:#EFF6FF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:100px;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.app{max-width:640px;margin:0 auto;padding:14px}
.hdr{background:linear-gradient(135deg,#8B5CF6,#6D28D9);border-radius:var(--r3);padding:14px;margin-bottom:14px;position:sticky;top:8px;z-index:40;box-shadow:0 4px 20px rgba(139,92,246,.3)}
.htop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand-r{width:38px;height:38px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#6D28D9}
.brand-t{font-size:15px;font-weight:800;color:#fff;line-height:1.1}
.brand-t span{color:rgba(255,255,255,.7)}
.brand-s{font-size:10px;color:rgba(255,255,255,.7);letter-spacing:.1em;margin-top:2px}
.hbtn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 12px;border-radius:var(--r2);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.hinfo{display:flex;align-items:center;gap:10px;color:#fff;font-size:12px}
.hinfo .av{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px}
.hinfo .nm{font-weight:800}
.hinfo .badge{background:#fff;color:#6D28D9;font-size:9px;font-weight:900;padding:2px 6px;border-radius:6px}
.db-status{margin:0 4px 14px;padding:8px 12px;border-radius:var(--r2);font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px}
.db-status.connecting{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#FBBF24}
.db-status.online{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#34D399}
.db-status.offline{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#F87171}
.db-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 16px;background:var(--surf);border:1px solid var(--brd);border-radius:20px;font-size:13px;font-weight:700;color:var(--tx2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:inherit;position:relative}
.tab.on{background:var(--priS);border-color:var(--pri2);color:var(--pri2);font-weight:800}
.tab .badge{background:var(--er);color:#fff;font-size:9px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r2);padding:14px}
.kpi .v{font-size:24px;font-weight:900;color:var(--acc);line-height:1}
.kpi .v.green{color:var(--pri2)}
.kpi .v.yellow{color:var(--wn)}
.kpi .v.purple{color:var(--pu)}
.kpi .v.red{color:var(--er)}
.kpi .l{font-size:11px;color:var(--tx2);margin-top:6px;font-weight:700;text-transform:uppercase}
.sec{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r3);margin-bottom:14px;overflow:hidden}
.sech{padding:14px 16px;background:var(--surf2);border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
.sect{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.secb{padding:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;background:var(--surf);border:1px solid var(--brd);border-radius:20px;font-size:12px;font-weight:700;color:var(--tx2);cursor:pointer;white-space:nowrap;font-family:inherit}
.chip.on{background:var(--priS);border-color:var(--pri2);color:var(--pri2);font-weight:800}
.row{display:flex;gap:12px;padding:12px;background:var(--surf2);border-radius:var(--r2);margin-bottom:8px;align-items:center}
.row .img{width:52px;height:52px;border-radius:var(--r2);background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden}
.row .img img{width:100%;height:100%;object-fit:cover}
.row .info{flex:1;min-width:0}
.row .n{font-size:13px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:11px;color:var(--tx2);margin-bottom:3px}
.row .p{font-size:14px;font-weight:900;color:var(--pri2)}
.row .act{display:flex;gap:6px;flex-shrink:0}
.row .abtn{width:36px;height:36px;border-radius:var(--r2);border:1px solid var(--brd);background:var(--surf);color:var(--tx);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.row .abtn.freeze{background:rgba(139,92,246,.15);color:#A78BFA}
.row .abtn.unfreeze{background:rgba(16,185,129,.15);color:#34D399}
.row .abtn.del{background:rgba(239,68,68,.15);color:#F87171}
.row.frozen{opacity:.6}
.order{background:var(--surf2);border-radius:var(--r2);padding:14px;margin-bottom:10px;border-left:3px solid var(--wn)}
.order.new{border-left-color:var(--acc)}
.order.done{border-left-color:var(--pri2);opacity:.85}
.order.cancel{border-left-color:var(--er);opacity:.7}
.order-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.order-h .id{font-size:12px;font-weight:900;color:var(--acc)}
.order-h .date{font-size:10px;color:var(--tx3);margin-top:2px}
.order-h .badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}
.badge.new{background:rgba(59,130,246,.15);color:#60A5FA}
.badge.acc{background:rgba(139,92,246,.15);color:#A78BFA}
.badge.way{background:rgba(245,158,11,.15);color:#FBBF24}
.badge.done{background:rgba(16,185,129,.15);color:#34D399}
.badge.cancel{background:rgba(239,68,68,.15);color:#F87171}
.order-cust{font-size:12px;color:var(--tx2);line-height:1.7;padding:10px;background:var(--surf);border-radius:var(--r2);margin-bottom:10px}
.order-cust b{color:var(--tx);font-weight:700}
.order-item{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--tx2);gap:10px}
.order-item .n{flex:1;color:var(--tx)}
.order-item .p{color:var(--pri2);font-weight:700;white-space:nowrap}
.order-total{display:flex;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--brd);font-size:14px;font-weight:900}
.order-total .v{color:var(--pri2);font-size:18px}
.order-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.order-acts .btn{flex:1;min-width:100px;font-size:12px;padding:10px}
.btn{padding:14px;border-radius:var(--r2);font-size:14px;font-weight:800;cursor:pointer;border:none;font-family:inherit;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff}
.bg{background:var(--surf2);color:var(--tx);border:1px solid var(--brd)}
.ba{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff}
.br{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff}
.bpu{background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff}
.bsm{padding:10px 14px;font-size:12px;width:auto;min-height:auto}
.empty{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty .ic{font-size:64px;margin-bottom:14px;opacity:.4}
.empty h3{font-size:16px;font-weight:800;color:var(--tx2);margin-bottom:8px}
.empty p{font-size:13px;line-height:1.6}
.role-check{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r3);padding:24px 20px;text-align:center;max-width:400px;margin:40px auto}
.role-check .ic{font-size:60px;margin-bottom:12px}
.role-check .t{font-size:20px;font-weight:900;margin-bottom:6px}
.role-check .d{font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:20px}
.code-input{width:100%;padding:16px;text-align:center;font-size:24px;font-weight:900;letter-spacing:6px;background:var(--surf2);border:2px solid transparent;border-radius:var(--r2);color:var(--pri2);outline:none;font-family:'Courier New',monospace}
.audit-item{padding:10px;background:var(--surf2);border-radius:var(--r2);margin-bottom:6px}
.audit-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.audit-a{font-size:12px;font-weight:800;color:var(--acc)}
.audit-w{font-size:10px;color:var(--tx3)}
.audit-d{font-size:11px;color:var(--tx2)}
.audit-t{font-size:10px;color:var(--tx3);margin-top:4px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--brd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--safe-b));z-index:100;max-width:640px;margin:0 auto}
.nb{background:none;border:none;color:var(--tx3);font-size:10px;font-weight:600;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;font-family:inherit}
.nb.on{color:var(--pri2)}
.nb .ic{font-size:22px}
.tst{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:100px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.e{background:var(--er);color:#fff}
.tst.o{background:var(--pri);color:#fff}
.md{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.md.on{display:flex}
.mbox{background:var(--surf);border-radius:var(--r3);padding:24px;max-width:380px;width:100%;text-align:center}
.mico{font-size:48px;margin-bottom:12px}
.mt{font-size:17px;font-weight:800;margin-bottom:6px}
.mdd{font-size:14px;color:var(--tx2);line-height:1.5;margin-bottom:20px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{padding:14px;border-radius:var(--r2);font-size:14px;font-weight:800;cursor:pointer;border:none;font-family:inherit}
.mbtn.g{background:var(--surf2);color:var(--tx);border:1px solid var(--brd)}
.mbtn.r{background:var(--er);color:#fff}
.mbtn.p{background:linear-gradient(135deg,var(--pu),#6D28D9);color:#fff}
.sk{background:linear-gradient(90deg,var(--surf) 25%,var(--surf2) 50%,var(--surf) 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:var(--r3);height:120px;margin-bottom:12px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body data-t="dark">
<div class="app">
<div class="hdr">
<div class="htop">
<div class="brand">
<div class="brand-r">R</div>
<div><div class="brand-t">RAYIS <span>ADMIN</span></div><div class="brand-s">BOSHQARUV PANELI</div></div>
</div>
<button class="hbtn" onclick="confirmLogout()">Chiqish</button>
</div>
<div class="hinfo">
<div class="av">⚙️</div>
<div class="nm" id="adminName">Admin</div>
<div class="badge" id="adminBadge">ADMIN</div>
</div>
</div>
<div class="db-status connecting" id="dbStatus">
<span class="dot"></span><span id="dbText">Firebase ulanmoqda...</span>
</div>
<div id="content"><div class="sk"></div><div class="sk"></div></div>
</div>
<div class="nav">
<button class="nb" onclick="location.href='home.html'"><span class="ic">🏠</span><span>Bosh</span></button>
<button class="nb on"><span class="ic">⚙️</span><span>Admin</span></button>
<button class="nb" onclick="location.href='orders.html'"><span class="ic">📦</span><span>Buyurtma</span></button>
<button class="nb" onclick="location.href='profile.html'"><span class="ic">👤</span><span>Profil</span></button>
<button class="nb" onclick="confirmLogout()"><span class="ic">🚪</span><span>Chiqish</span></button>
</div>
<div class="md" id="md" onclick="if(event.target.id==='md')closeMd()">
<div class="mbox" id="mbox"></div>
</div>
<div class="tst" id="tst"></div>

<script>
// ============================================
// ADMIN CODES
// ============================================
var ADMIN_CODES={
'63638793141822':{role:'Xo\'jayin',ic:'👑',level:1},
'1001':{role:'Admin',ic:'⚙️',level:2},
'1002':{role:'Nazoratchi',ic:'👁',level:3},
'1008':{role:'Hisobchi',ic:'📊',level:3}
};

var S={tab:'dash',admin:null,user:{},filterOrders:'all',orders:[],products:[],shops:[],users:[],audit:[],frozen:{products:[],shops:[],users:[]}};

function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){var e=document.getElementById('tst');e.textContent=m;e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');clearTimeout(e._t);e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':tp==='o'?' o':'');},2400);}
function updateDbStatus(cls,text){var el=document.getElementById('dbStatus');if(!el)return;el.className='db-status '+cls;document.getElementById('dbText').textContent=text;}
function toArray(val){if(!val)return[];if(Array.isArray(val))return val;if(typeof val==='object')return Object.values(val);return[];}
function uid(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function fmtDate(iso){if(!iso)return '—';try{var d=new Date(iso);var pad=function(n){return String(n).padStart(2,'0');};return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}catch(e){return '—';}}
async function audit(action,details){
try{var log=toArray(DB.get('audit',[]));log.unshift({id:uid('a'),action:action,details:String(details||'').slice(0,120),by:S.admin?S.admin.role:'anonim',time:new Date().toISOString()});if(log.length>300)log=log.slice(0,300);await DB.set('audit',log);}catch(e){}
}
function isFrozen(type,id){return (S.frozen[type]||[]).indexOf(id)!==-1;}
async function freezeItem(type,id,label){
if(!S.frozen[type])S.frozen[type]=[];
if(S.frozen[type].indexOf(id)===-1)S.frozen[type].push(id);
try{await DB.set('frozen',S.frozen);await audit('freeze_'+type,label||id);toast('❄️ Muzlatildi','o');}catch(e){toast('Xato','e');}
}
async function unfreezeItem(type,id,label){
if(!S.frozen[type])return;
S.frozen[type]=S.frozen[type].filter(function(x){return x!==id;});
try{await DB.set('frozen',S.frozen);await audit('unfreeze_'+type,label||id);toast('✅ Faollashtirildi','o');}catch(e){toast('Xato','e');}
}
function render(){
S.admin=DB.get('admin',null);
if(!S.admin||!S.admin.role){renderLogin();return;}
document.getElementById('adminName').textContent=S.admin.role;
document.getElementById('adminBadge').textContent=(S.admin.role||'ADMIN').toUpperCase();
var h='';h+=renderTabs();
if(S.tab==='dash')h+=renderDash();
else if(S.tab==='orders')h+=renderOrders();
else if(S.tab==='products')h+=renderProducts();
else if(S.tab==='shops')h+=renderShops();
else if(S.tab==='users')h+=renderUsers();
else if(S.tab==='audit')h+=renderAudit();
document.getElementById('content').innerHTML=h;
}
function renderLogin(){
document.getElementById('content').innerHTML='<div class="role-check"><div class="ic">🔐</div><div class="t">Admin kirishi</div><div class="d">Maxsus kodni kiriting<br>Faqat rahbariyat uchun</div><input class="code-input" id="adminCode" type="tel" maxlength="20" placeholder="••••" inputmode="numeric" style="margin-bottom:14px"><button class="btn bpu" onclick="doAdminLogin()">🔐 Kirish</button><button class="btn bg" style="margin-top:8px" onclick="location.href=\'index.html\'">← Orqaga</button><div style="font-size:11px;color:var(--tx3);margin-top:16px;line-height:1.7">Demo kodlar:<br><b style="color:var(--pri2)">1001</b> — Admin<br><b style="color:var(--pri2)">1002</b> — Nazoratchi<br><b style="color:var(--pri2)">1008</b> — Hisobchi</div></div>';
setTimeout(function(){var el=document.getElementById('adminCode');if(el){el.focus();el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doAdminLogin();}});}},100);
}
async function doAdminLogin(){
var code=(document.getElementById('adminCode').value||'').trim();
var admin=ADMIN_CODES[code];
if(!admin){toast('Kod noto\'g\'ri','e');return;}
S.admin=Object.assign({},admin,{code:code,loginAt:Date.now()});
try{await DB.set('admin',S.admin);}catch(e){}
await audit('login',admin.role);
toast('✅ Xush kelibsiz, '+admin.role,'o');
}
function renderTabs(){
var newOrders=S.orders.filter(function(o){return o.status==='yangi';}).length;
return '<div class="tabs">'+
'<button class="tab '+(S.tab==='dash'?'on':'')+'" onclick="setTab(\'dash\')">📊 Panel</button>'+
'<button class="tab '+(S.tab==='orders'?'on':'')+'" onclick="setTab(\'orders\')">📋 Buyurtma'+(newOrders>0?'<span class="badge">'+newOrders+'</span>':'')+'</button>'+
'<button class="tab '+(S.tab==='products'?'on':'')+'" onclick="setTab(\'products\')">📦 Mahsulot</button>'+
'<button class="tab '+(S.tab==='shops'?'on':'')+'" onclick="setTab(\'shops\')">🏪 Do\'konlar</button>'+
'<button class="tab '+(S.tab==='users'?'on':'')+'" onclick="setTab(\'users\')">👥 Users</button>'+
'<button class="tab '+(S.tab==='audit'?'on':'')+'" onclick="setTab(\'audit\')">📜 Audit</button>'+
'</div>';
}
function setTab(t){S.tab=t;render();window.scrollTo({top:0,behavior:'smooth'});}
function renderDash(){
var orders=S.orders;
var products=S.products;
var shops=S.shops;
var users=S.users;
var totalRevenue=orders.filter(function(o){return o.status==='yetkazildi';}).reduce(function(s,o){return s+(Number(o.total)||0);},0);
var todayOrders=orders.filter(function(o){if(!o.createdAt)return false;return new Date(o.createdAt).toDateString()===new Date().toDateString();}).length;
var newOrders=orders.filter(function(o){return o.status==='yangi';}).length;
var totalFrozen=(S.frozen.products||[]).length+(S.frozen.shops||[]).length+(S.frozen.users||[]).length;
var h='<div class="kpis"><div class="kpi"><div class="v">'+orders.length+'</div><div class="l">Buyurtma</div></div><div class="kpi"><div class="v yellow">'+newOrders+'</div><div class="l">Yangi</div></div><div class="kpi"><div class="v green" style="font-size:16px">'+fmt(totalRevenue)+'</div><div class="l">Tushum</div></div><div class="kpi"><div class="v purple">'+todayOrders+'</div><div class="l">Bugun</div></div></div>';
h+='<div class="kpis"><div class="kpi"><div class="v">'+products.length+'</div><div class="l">Mahsulotlar</div></div><div class="kpi"><div class="v">'+shops.length+'</div><div class="l">Do\'konlar</div></div><div class="kpi"><div class="v">'+users.length+'</div><div class="l">Foydalanuvchi</div></div><div class="kpi"><div class="v red">'+totalFrozen+'</div><div class="l">Muzlatilgan</div></div></div>';
h+='<div class="sec"><div class="sech"><div class="sect">🕒 So\'nggi buyurtmalar</div><div style="font-size:12px;color:var(--tx3)">'+orders.length+' ta</div></div><div class="secb">';
if(!orders.length){h+='<div style="text-align:center;padding:24px;color:var(--tx3);font-size:13px">Buyurtma yo\'q</div>';}
else{orders.slice(0,5).forEach(function(o){h+=miniOrder(o);});}
h+='</div></div>';
return h;
}
function miniOrder(o){
var st=o.status||'yangi';
var stMap={yangi:{l:'🆕',c:'new'},tolandi:{l:'✅',c:'acc'},yolda:{l:'🚚',c:'way'},yetkazildi:{l:'📦',c:'done'},bekor:{l:'❌',c:'cancel'}};
var s=stMap[st]||stMap.yangi;
return '<div class="order '+(st==='yangi'?'new':st==='yetkazildi'?'done':st==='bekor'?'cancel':'')+'" style="padding:10px;margin-bottom:6px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:900;color:var(--acc)">#'+esc(o.id)+'</div><div style="font-size:10px;color:var(--tx3);margin-top:2px">'+fmtDate(o.createdAt)+'</div></div><div class="badge '+s.c+'" style="padding:3px 8px;font-size:10px">'+s.l+' '+st+'</div><div style="font-size:14px;font-weight:900;color:var(--pri2)">'+fmt(o.total)+'</div></div></div>';
}
function countBy(st){return S.orders.filter(function(o){return o.status===st;}).length;}
function setFilterOrders(f){S.filterOrders=f;render();}
function renderOrders(){
var filtered=S.filterOrders==='all'?S.orders:S.orders.filter(function(o){return o.status===S.filterOrders;});
filtered.sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');});
var h='<div class="chips"><div class="chip '+(S.filterOrders==='all'?'on':'')+'" onclick="setFilterOrders(\'all\')">Barchasi ('+S.orders.length+')</div><div class="chip '+(S.filterOrders==='yangi'?'on':'')+'" onclick="setFilterOrders(\'yangi\')">🆕 Yangi ('+countBy('yangi')+')</div><div class="chip '+(S.filterOrders==='tolandi'?'on':'')+'" onclick="setFilterOrders(\'tolandi\')">✅ To\'landi ('+countBy('tolandi')+')</div><div class="chip '+(S.filterOrders==='yolda'?'on':'')+'" onclick="setFilterOrders(\'yolda\')">🚚 Yo\'lda ('+countBy('yolda')+')</div><div class="chip '+(S.filterOrders==='yetkazildi'?'on':'')+'" onclick="setFilterOrders(\'yetkazildi\')">📦 Yetkazildi ('+countBy('yetkazildi')+')</div><div class="chip '+(S.filterOrders==='bekor'?'on':'')+'" onclick="setFilterOrders(\'bekor\')">❌ Bekor ('+countBy('bekor')+')</div></div>';
h+='<div class="sec"><div class="sech"><div class="sect">📋 Buyurtmalar</div><div style="font-size:12px;color:var(--tx3)">'+filtered.length+' ta</div></div><div class="secb">';
if(!filtered.length){h+='<div style="text-align:center;padding:24px;color:var(--tx3);font-size:13px">Buyurtma yo\'q</div>';}
else{filtered.forEach(function(o){h+=orderCard(o);});}
h+='</div></div>';
return h;
}
function orderCard(o){
var st=o.status||'yangi';
var stMap={yangi:{l:'🆕 Yangi',c:'new'},tolandi:{l:'✅ To\'landi',c:'acc'},yolda:{l:'🚚 Yo\'lda',c:'way'},yetkazildi:{l:'📦 Yetkazildi',c:'done'},bekor:{l:'❌ Bekor',c:'cancel'}};
var s=stMap[st]||stMap.yangi;
var cust=o.customer||{};
var h='<div class="order '+(st==='yangi'?'new':st==='yetkazildi'?'done':st==='bekor'?'cancel':'')+'"><div class="order-h"><div><div class="id">#'+esc(o.id)+'</div><div class="date">'+fmtDate(o.createdAt)+'</div></div><div class="badge '+s.c+'">'+s.l+'</div></div>';
h+='<div class="order-cust">👤 <b>'+esc(cust.name||'—')+'</b><br>📞 '+esc(cust.phone||'—')+'<br>📍 '+esc([cust.region,cust.district,cust.address].filter(Boolean).join(', '))+'<br>💳 '+esc(o.paymentName||'—')+'</div>';
if(o.items&&o.items.length){h+='<div style="margin-bottom:10px">';o.items.forEach(function(it){var sum=(Number(it.price)||0)*(Number(it.qty)||1);h+='<div class="order-item"><div class="n">'+esc(it.name)+' × '+it.qty+'</div><div class="p">'+fmt(sum)+'</div></div>';});h+='</div>';}
h+='<div class="order-total"><span>Jami:</span><span class="v">'+fmt(o.total)+'</span></div>';
if(st==='yangi'||st==='tolandi'||st==='yolda'){h+='<div class="order-acts">';if(st==='yangi')h+='<button class="btn ba bsm" onclick="setStatus(\''+o.id+'\',\'tolandi\')">✅ Qabul</button>';if(st==='tolandi')h+='<button class="btn ba bsm" onclick="setStatus(\''+o.id+'\',\'yolda\')">🚚 Yo\'lga</button>';if(st==='yolda')h+='<button class="btn bp bsm" onclick="setStatus(\''+o.id+'\',\'yetkazildi\')">📦 Yetkazildi</button>';if(st!=='yetkazildi')h+='<button class="btn br bsm" onclick="setStatus(\''+o.id+'\',\'bekor\')">❌ Bekor</button>';h+='</div>';}
h+='</div>';
return h;
}
async function setStatus(id,st){
try{var orders=toArray(DB.get('orders',[]));var idx=orders.findIndex(function(o){return o.id===id;});if(idx===-1)return;orders[idx].status=st;orders[idx].updatedAt=new Date().toISOString();if(!orders[idx].statusLog)orders[idx].statusLog=[];orders[idx].statusLog.push({status:st,date:new Date().toISOString(),by:S.admin.role});await DB.set('orders',orders);await audit('order_status',id+' → '+st);toast('Holat: '+st,'o');}catch(e){toast('Xato','e');}
}
function renderProducts(){
var h='<div class="sec"><div class="sech"><div class="sect">📦 Mahsulotlar</div><div style="font-size:12px;color:var(--tx3)">'+S.products.length+' ta</div></div><div class="secb">';
if(!S.products.length){h+='<div style="text-align:center;padding:24px;color:var(--tx3);font-size:13px">Mahsulot yo\'q</div>';}
else{S.products.forEach(function(p){
var frozen=isFrozen('products',p.id);
var img=p.images&&p.images[0]?'<img src="'+p.images[0]+'">':(p.emoji||'📦');
h+='<div class="row'+(frozen?' frozen':'')+'"><div class="img">'+img+'</div><div class="info"><div class="n">'+esc(p.name)+(frozen?' ❄️':'')+'</div><div class="m">🏪 '+esc(p.shopName||'—')+'</div><div class="p">'+fmt(p.price)+' · '+p.stock+' '+esc(p.unit||'dona')+'</div></div><div class="act">'+(frozen?'<button class="abtn unfreeze" onclick="unfreezeItem(\'products\',\''+p.id+'\',\''+esc(p.name)+'\')">🔥</button>':'<button class="abtn freeze" onclick="freezeItem(\'products\',\''+p.id+'\',\''+esc(p.name)+'\')">❄️</button>')+'<button class="abtn del" onclick="delProduct(\''+p.id+'\')">🗑</button></div></div>';
});}
h+='</div></div>';
return h;
}
var _delProdId=null;
function delProduct(id){_delProdId=id;openMd('🗑','O\'chirilsinmi?','Mahsulot o\'chiriladi.','O\'chirish','r',async function(){var products=toArray(DB.get('products',[])).filter(function(p){return p.id!==_delProdId;});try{await DB.set('products',products);await audit('del_product',_delProdId);toast('🗑 O\'chirildi','o');}catch(e){toast('Xato','e');}});}
function renderShops(){
var h='<div class="sec"><div class="sech"><div class="sect">🏪 Do\'konlar</div><div style="font-size:12px;color:var(--tx3)">'+S.shops.length+' ta</div></div><div class="secb">';
if(!S.shops.length){h+='<div style="text-align:center;padding:24px;color:var(--tx3);font-size:13px">Do\'kon yo\'q</div>';}
else{S.shops.forEach(function(s){
var frozen=isFrozen('shops',s.id);
var img=s.logo?'<img src="'+s.logo+'">':'🏪';
var prodCount=S.products.filter(function(p){return p.shopId===s.id;}).length;
h+='<div class="row'+(frozen?' frozen':'')+'"><div class="img">'+img+'</div><div class="info"><div class="n">'+esc(s.name)+(frozen?' ❄️':'')+'</div><div class="m">👤 '+esc(s.ownerName||'—')+'</div><div class="m">📞 '+esc(s.phone||'—')+'</div><div class="p" style="color:var(--acc)">'+prodCount+' ta mahsulot</div></div><div class="act">'+(frozen?'<button class="abtn unfreeze" onclick="unfreezeItem(\'shops\',\''+s.id+'\',\''+esc(s.name)+'\')">🔥</button>':'<button class="abtn freeze" onclick="freezeItem(\'shops\',\''+s.id+'\',\''+esc(s.name)+'\')">❄️</button>')+'<button class="abtn del" onclick="delShop(\''+s.id+'\')">🗑</button></div></div>';
});}
h+='</div></div>';
return h;
}
var _delShopId=null;
function delShop(id){_delShopId=id;openMd('🗑','Do\'kon o\'chirilsinmi?','Do\'kon va mahsulotlari o\'chiriladi.','O\'chirish','r',async function(){var shops=toArray(DB.get('shops',[])).filter(function(s){return s.id!==_delShopId;});var products=toArray(DB.get('products',[])).filter(function(p){return p.shopId!==_delShopId;});try{await DB.set('shops',shops);await DB.set('products',products);await audit('del_shop',_delShopId);toast('🗑 O\'chirildi','o');}catch(e){toast('Xato','e');}});}
function renderUsers(){
var h='<div class="sec"><div class="sech"><div class="sect">👥 Foydalanuvchilar</div><div style="font-size:12px;color:var(--tx3)">'+S.users.length+' ta</div></div><div class="secb">';
if(!S.users.length){h+='<div style="text-align:center;padding:24px;color:var(--tx3);font-size:13px">Foydalanuvchi yo\'q</div>';}
else{S.users.forEach(function(u){
var frozen=isFrozen('users',u.userId);
var initial=(u.firstName||u.name||'?').charAt(0).toUpperCase();
var orders=S.orders.filter(function(o){return o.customer&&o.customer.phone===u.phone;});
var totalSpent=orders.filter(function(o){return o.status==='yetkazildi';}).reduce(function(s,o){return s+(Number(o.total)||0);},0);
h+='<div class="row'+(frozen?' frozen':'')+'"><div class="img" style="background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;font-size:18px;font-weight:900">'+initial+'</div><div class="info"><div class="n">'+esc(u.name||u.firstName||'Foydalanuvchi')+(frozen?' ❄️':'')+'</div><div class="m">📞 '+esc(u.phone||'—')+'</div><div class="p" style="color:var(--acc)">'+orders.length+' buyurtma · '+fmt(totalSpent)+'</div></div><div class="act">'+(frozen?'<button class="abtn unfreeze" onclick="unfreezeItem(\'users\',\''+u.userId+'\',\''+esc(u.name||u.phone)+'\')">🔥</button>':'<button class="abtn freeze" onclick="freezeItem(\'users\',\''+u.userId+'\',\''+esc(u.name||u.phone)+'\')">❄️</button>')+'<button class="abtn del" onclick="delUser(\''+u.userId+'\')">🗑</button></div></div>';
});}
h+='</div></div>';
return h;
}
var _delUserId=null;
function delUser(id){_delUserId=id;openMd('🗑','Foydalanuvchi o\'chirilsinmi?','Ro\'yxatdan o\'chiriladi.','O\'chirish','r',async function(){var users=toArray(DB.get('users',[])).filter(function(u){return u.userId!==_delUserId;});try{await DB.set('users',users);await audit('del_user',_delUserId);toast('🗑 O\'chirildi','o');}catch(e){toast('Xato','e');}});}
function renderAudit(){
var log=S.audit;
var h='<div class="sec"><div class="sech"><div class="sect">📜 Audit log</div><div style="font-size:12px;color:var(--tx3)">'+log.length+' ta</div></div><div class="secb">';
if(!log.length){h+='<div style="text-align:center;padding:24px;color:var(--tx3);font-size:13px">Log bo\'sh</div>';}
else{log.slice(0,50).forEach(function(item){
h+='<div class="audit-item"><div class="audit-h"><div class="audit-a">'+esc(item.action)+'</div><div class="audit-w">'+esc(item.by||'—')+'</div></div><div class="audit-d">'+esc(item.details||'')+'</div><div class="audit-t">'+fmtDate(item.time)+'</div></div>';
});
if(log.length>50)h+='<div style="text-align:center;font-size:11px;color:var(--tx3);padding:10px">+ yana '+(log.length-50)+'</div>';}
h+='</div></div>';
h+='<div style="margin-top:14px"><button class="btn br" onclick="clearAudit()">🗑 Log tozalash</button></div>';
return h;
}
function clearAudit(){openMd('🗑','Log tozalansinmi?','Barcha yozuvlar o\'chiriladi.','Tozalash','r',async function(){try{await DB.set('audit',[]);toast('🗑 Tozalandi','o');}catch(e){toast('Xato','e');}});}
var _cb=null;
function openMd(ico,t,d,okText,okCls,cb){
document.getElementById('mbox').innerHTML='<div class="mico">'+ico+'</div><div class="mt">'+t+'</div><div class="mdd">'+esc(d)+'</div><div class="mbtns"><button class="mbtn g" onclick="closeMd()">Bekor</button><button class="mbtn '+(okCls||'r')+'" onclick="mdConfirm()">'+okText+'</button></div>';
_cb=cb;document.getElementById('md').classList.add('on');
}
function closeMd(){document.getElementById('md').classList.remove('on');_cb=null;}
function mdConfirm(){if(_cb)_cb();closeMd();}
function confirmLogout(){openMd('🚪','Chiqish','Admin panelidan chiqmoqchimisiz?','Chiqish','r',async function(){try{await audit('logout',S.admin?S.admin.role:'');await DB.remove('admin');}catch(e){}toast('👋 Chiqdingiz','o');setTimeout(function(){location.href='index.html';},600);});}
function setupListeners(){
DB.on('orders',function(val){S.orders=toArray(val).filter(function(o){return o&&o.id;});render();});
DB.on('products',function(val){S.products=toArray(val).filter(function(p){return p&&p.name;});render();});
DB.on('shops',function(val){S.shops=toArray(val).filter(function(s){return s&&s.name;});render();});
DB.on('users',function(val){S.users=toArray(val).filter(function(u){return u&&u.userId;});render();});
DB.on('frozen',function(val){S.frozen=val||{products:[],shops:[],users:[]};render();});
DB.on('audit',function(val){S.audit=toArray(val);if(S.tab==='audit')render();});
}
function init(){
var th=DB.get('theme','dark');document.body.dataset.t=th;
S.user=DB.get('user',{});
S.orders=toArray(DB.get('orders',[]));S.products=toArray(DB.get('products',[]));
S.shops=toArray(DB.get('shops',[]));S.users=toArray(DB.get('users',[]));
S.frozen=DB.get('frozen',{products:[],shops:[],users:[]});S.audit=toArray(DB.get('audit',[]));
S.admin=DB.get('admin',null);
render();
if(DB.isReady())onReady();
else{window.addEventListener('db:ready',onReady);setTimeout(function(){updateDbStatus('offline','💾 Offline rejim');},3000);}
window.addEventListener('db:connection',function(e){updateDbStatus(e.detail.online?'online':'offline',e.detail.online?'🟢 Online':'🔴 Offline');});
}
function onReady(){
console.log('🔥 Firebase tayyor');
updateDbStatus('online','🟢 Online — real-time');
DB.syncAll().then(function(){
S.admin=DB.get('admin',null);
S.orders=toArray(DB.get('orders',[]));S.products=toArray(DB.get('products',[]));
S.shops=toArray(DB.get('shops',[]));S.users=toArray(DB.get('users',[]));
S.frozen=DB.get('frozen',{products:[],shops:[],users:[]});S.audit=toArray(DB.get('audit',[]));
setupListeners();
render();
});
}
init();
console.log('✅ Admin sahifasi — Firebase bilan');
</script>
