<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0B1119">
<title>Savat — RAYIS BOZORI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>

<style>
:root{
  --bg:#0B1119;--surf:#151C26;--surf2:#1E2733;--brd:#2A3441;
  --tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;
  --pri:#10B981;--pri2:#34D399;--priS:#064E3B;
  --acc:#3B82F6;--accS:#1E3A8A;
  --er:#EF4444;--wn:#F59E0B;--pu:#8B5CF6;
  --r1:8px;--r2:12px;--r3:16px;--r4:24px;
  --sh2:0 4px 12px rgba(0,0,0,.4);
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-t="light"]{
  --bg:#F5F7FA;--surf:#FFFFFF;--surf2:#EEF2F7;--brd:#E2E8F0;
  --tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;
  --pri:#059669;--pri2:#10B981;--priS:#ECFDF5;
  --acc:#2563EB;--accS:#EFF6FF;
  --sh2:0 4px 12px rgba(15,23,42,.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:220px;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}

.app{max-width:640px;margin:0 auto;padding:14px}
.hdr{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r3);padding:12px;margin-bottom:14px;position:sticky;top:8px;z-index:40;display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border-radius:var(--r2);background:var(--surf2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--tx);flex-shrink:0}
.back:active{transform:scale(.92)}
.htitle{flex:1;font-size:17px;font-weight:800}
.htitle span{color:var(--tx3);font-weight:600;font-size:13px;margin-left:6px}
.hedit{font-size:13px;color:var(--er);font-weight:700;cursor:pointer;padding:8px 10px;border-radius:8px}
.hedit:active{background:rgba(239,68,68,.1)}

.db-status{margin:0 4px 14px;padding:8px 12px;border-radius:var(--r2);font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px}
.db-status.connecting{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#FBBF24}
.db-status.online{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#34D399}
.db-status.offline{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#F87171}
.db-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.sec{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r3);overflow:hidden;margin-bottom:12px}
.sech{padding:14px 16px;background:var(--surf2);border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
.sect{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.sect span{font-size:12px;color:var(--tx3);font-weight:600}
.secb{padding:12px 16px}

.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--brd)}
.item:last-child{border-bottom:none}
.icover{width:76px;height:76px;border-radius:var(--r2);background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:38px;flex-shrink:0;overflow:hidden}
.icover img{width:100%;height:100%;object-fit:cover}
.ibody{flex:1;min-width:0;display:flex;flex-direction:column}
.iname{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ivar{font-size:12px;color:var(--acc);font-weight:600;margin-bottom:4px}
.ishop{font-size:11px;color:var(--wn);font-weight:600;margin-bottom:6px}
.iprice{font-size:15px;font-weight:900;color:var(--pri2)}
.ifoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
.qty{display:flex;align-items:center;gap:8px;background:var(--surf2);border-radius:var(--r2);padding:4px}
.qbtn{width:34px;height:34px;border-radius:10px;background:var(--surf);border:1px solid var(--brd);color:var(--tx);font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.qbtn:active{transform:scale(.9)}
.qbtn.minus{color:var(--er)}
.qbtn.plus{color:var(--pri2)}
.qnum{font-size:15px;font-weight:800;min-width:32px;text-align:center}
.isum{font-size:16px;font-weight:900;color:var(--tx);text-align:right;flex:1}
.irm{width:38px;height:38px;border-radius:var(--r2);background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--er);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
.irm:active{transform:scale(.9)}

.promo{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r3);padding:14px 16px;margin-bottom:12px;transition:.3s}
.promo.ok{border-color:var(--pri2);background:var(--priS)}
.promo-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.promo-head .ic{font-size:20px}
.promo-head .t{font-size:14px;font-weight:800;flex:1}
.promo-head .b{padding:3px 8px;background:var(--priS);color:var(--pri2);font-size:10px;font-weight:800;border-radius:6px}
.promo-row{display:flex;gap:8px}
.promo-input{flex:1;padding:12px 14px;background:var(--surf2);border:2px solid transparent;border-radius:var(--r2);color:var(--tx);font-size:14px;font-weight:700;outline:none;font-family:inherit;text-transform:uppercase;letter-spacing:1px}
.promo-input:focus{border-color:var(--pri2)}
.promo-btn{padding:12px 20px;background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border:none;border-radius:var(--r2);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.promo-applied{display:flex;justify-content:space-between;align-items:center;gap:10px}
.promo-code{background:var(--priS);border:1px solid rgba(16,185,129,.4);color:var(--pri2);padding:8px 14px;border-radius:var(--r2);font-size:14px;font-weight:900;letter-spacing:1px}
.promo-info{flex:1;font-size:12px;color:var(--pri2);font-weight:700}
.promo-rm{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--er);padding:8px 12px;border-radius:var(--r2);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.promo-err{color:var(--er);font-size:12px;margin-top:8px;text-align:center;min-height:16px;font-weight:600}
.promo-hint{font-size:11px;color:var(--tx3);margin-top:8px;text-align:center}
.promo-hint b{color:var(--acc);cursor:pointer;font-weight:700}

.deliv-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.deliv-row .l{color:var(--tx2)}
.deliv-row .v{color:var(--tx);font-weight:700}
.deliv-row.disc .v{color:var(--pri2)}
.deliv-row.total{border-top:2px solid var(--brd);margin-top:6px;padding-top:12px;font-size:16px;font-weight:900}
.deliv-row.total .v{color:var(--pri2);font-size:22px}

.bbar{position:fixed;bottom:calc(66px + var(--safe-b));left:0;right:0;background:var(--surf);border-top:1px solid var(--brd);padding:12px 14px;z-index:90;max-width:640px;margin:0 auto;box-shadow:0 -4px 12px rgba(0,0,0,.3)}
.bbar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 4px}
.bbar-top .lbl{font-size:12px;color:var(--tx2);font-weight:600}
.bbar-top .val{font-size:20px;font-weight:900;color:var(--pri2)}
.bbar-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border:none;border-radius:var(--r2);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.bbar-btn:active{transform:scale(.98)}

.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--brd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--safe-b));z-index:100;max-width:640px;margin:0 auto}
.nb{background:none;border:none;color:var(--tx3);font-size:10px;font-weight:600;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;position:relative;font-family:inherit}
.nb.on{color:var(--pri2)}
.nb:active{transform:scale(.92)}
.nb .ic{font-size:22px}
.nb .cnt{position:absolute;top:0;right:20%;background:var(--er);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surf)}

.empty{text-align:center;padding:70px 20px;color:var(--tx3)}
.empty .ic{font-size:80px;margin-bottom:16px;opacity:.4}
.empty h3{font-size:18px;font-weight:800;color:var(--tx2);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.6;margin-bottom:22px}
.empty button{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border:none;padding:14px 28px;border-radius:var(--r2);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}

.tst{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:100px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;box-shadow:var(--sh2)}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.e{background:var(--er);color:#fff}
.tst.o{background:var(--pri);color:#fff}

.cm{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.cm.on{display:flex}
.cmbox{background:var(--surf);border-radius:var(--r3);padding:24px;max-width:380px;width:100%;text-align:center}
.cmico{font-size:48px;margin-bottom:12px}
.cmt{font-size:17px;font-weight:800;margin-bottom:6px}
.cmd{font-size:14px;color:var(--tx2);line-height:1.5;margin-bottom:20px}
.cmbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmbtn{padding:14px;border-radius:var(--r2);font-size:14px;font-weight:800;cursor:pointer;border:none;font-family:inherit}
.cmbtn.g{background:var(--surf2);color:var(--tx);border:1px solid var(--brd)}
.cmbtn.r{background:var(--er);color:#fff}

.sk{background:linear-gradient(90deg,var(--surf) 25%,var(--surf2) 50%,var(--surf) 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:var(--r2);height:76px;margin-bottom:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body data-t="dark">

<div class="app">
  <div class="hdr">
    <button class="back" onclick="goBack()">←</button>
    <div class="htitle">Savat <span id="pageCount"></span></div>
    <div class="hedit" id="editBtn" onclick="clearAll()" style="display:none">🗑</div>
  </div>

  <div class="db-status connecting" id="dbStatus">
    <span class="dot"></span><span id="dbText">Firebase ulanmoqda...</span>
  </div>

  <div id="content">
    <div class="sk"></div>
    <div class="sk"></div>
    <div class="sk"></div>
  </div>
</div>

<div class="bbar" id="bbar" style="display:none">
  <div class="bbar-top">
    <span class="lbl">Jami:</span>
    <span class="val" id="totalVal">0 so'm</span>
  </div>
  <button class="bbar-btn" onclick="goCheckout()">
    <span>Buyurtma berish</span><span>→</span>
  </button>
</div>

<div class="nav">
  <button class="nb" onclick="location.href='home.html'"><span class="ic">🏠</span><span>Bosh</span></button>
  <button class="nb" onclick="location.href='search.html'"><span class="ic">🔍</span><span>Qidiruv</span></button>
  <button class="nb" onclick="location.href='kalkulyator.html'"><span class="ic">🧮</span><span>Kalkulyator</span></button>
  <button class="nb on"><span class="ic">🛒</span><span>Savat</span><span class="cnt" id="navCartCnt" style="display:none">0</span></button>
  <button class="nb" onclick="location.href='profile.html'"><span class="ic">👤</span><span>Profil</span></button>
</div>

<div class="tst" id="tst"></div>

<div class="cm" id="cm" onclick="if(event.target.id==='cm')closeCm()">
  <div class="cmbox">
    <div class="cmico" id="cmIco">🗑</div>
    <div class="cmt" id="cmT">O'chirilsinmi?</div>
    <div class="cmd" id="cmD">—</div>
    <div class="cmbtns">
      <button class="cmbtn g" onclick="closeCm()">Bekor</button>
      <button class="cmbtn r" id="cmOk" onclick="cmConfirm()">O'chirish</button>
    </div>
  </div>
</div>

<script>
var PROMOS=[
  {code:'RAYIS10',type:'percent',value:10,active:true,used:false},
  {code:'RAYIS20',type:'percent',value:20,active:true,used:false},
  {code:'YANGI50',type:'percent',value:50,active:true,used:false},
  {code:'BEPUL10K',type:'fixed',value:10000,active:true,used:false}
];

var S={
  cart:[],
  promo:null,
  user:null
};

function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){
  var e=document.getElementById('tst');
  e.textContent=m;
  e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');
  clearTimeout(e._t);
  e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':tp==='o'?' o':'');},2400);
}
function goBack(){if(history.length>1)history.back();else location.href='home.html';}
function updateDbStatus(cls,text){
  var el=document.getElementById('dbStatus');
  if(!el)return;
  el.className='db-status '+cls;
  document.getElementById('dbText').textContent=text;
}
function toArray(val){
  if(!val)return[];
  if(Array.isArray(val))return val;
  if(typeof val==='object')return Object.values(val);
  return[];
}

function cartCount(){
  return S.cart.reduce(function(s,i){return s+(Number(i.qty)||0);},0);
}
function productsTotal(){
  return S.cart.reduce(function(s,i){return s+(Number(i.price)||0)*(Number(i.qty)||1);},0);
}
function discountAmount(){
  if(!S.promo)return 0;
  var t=productsTotal();
  if(S.promo.type==='percent')return Math.round(t*S.promo.value/100);
  if(S.promo.type==='fixed')return Math.min(S.promo.value,t);
  return 0;
}
function grandTotal(){return Math.max(0,productsTotal()-discountAmount());}

function updateCartBadge(){
  var cnt=cartCount();
  var el=document.getElementById('navCartCnt');
  if(el){
    if(cnt>0){el.textContent=cnt>99?'99+':cnt;el.style.display='flex';}
    else el.style.display='none';
  }
}

async function changeQty(cartKey,delta){
  var item=S.cart.find(function(i){return (i.cartKey||i.id)===cartKey;});
  if(!item)return;
  item.qty=(Number(item.qty)||1)+delta;
  if(item.qty<=0){
    S.cart=S.cart.filter(function(i){return (i.cartKey||i.id)!==cartKey;});
    toast('🗑 O\'chirildi','o');
  }
  try{await DB.set('cart',S.cart);}catch(e){}
  render();
}

var _pendingDelete=null;
function removeItem(cartKey){
  _pendingDelete=cartKey;
  openCm('🗑','O\'chirilsinmi?','Mahsulot savatdan olib tashlanadi','O\'chirish',async function(){
    S.cart=S.cart.filter(function(i){return (i.cartKey||i.id)!==_pendingDelete;});
    try{await DB.set('cart',S.cart);}catch(e){}
    toast('🗑 O\'chirildi','o');
    render();
  });
}

function clearAll(){
  if(cartCount()===0)return;
  openCm('🗑','Savat tozalansinmi?','Barcha mahsulotlar o\'chiriladi','Tozalash',async function(){
    S.cart=[];
    S.promo=null;
    try{
      await DB.set('cart',[]);
      await DB.remove('promo');
    }catch(e){}
    toast('🗑 Tozalandi','o');
    render();
  });
}

async function applyPromo(){
  var inp=document.getElementById('promoInput');
  var err=document.getElementById('promoErr');
  if(!inp)return;
  var code=(inp.value||'').trim().toUpperCase();
  err.textContent='';
  if(!code){err.textContent='Kodni kiriting';return;}
  if(cartCount()===0){err.textContent='Savat bo\'sh';return;}
  var firebasePromos=DB.get('promos',[]);
  var allPromos=PROMOS.concat(toArray(firebasePromos));
  var found=allPromos.find(function(p){
    return p.code===code&&p.active!==false&&!p.used;
  });
  if(!found){err.textContent='❌ Kod noto\'g\'ri yoki muddati tugagan';return;}
  S.promo=found;
  try{await DB.set('promo',found);}catch(e){}
  toast('✅ '+found.code+' qo\'llandi','o');
  render();
}

async function removePromo(){
  S.promo=null;
  try{await DB.remove('promo');}catch(e){}
  toast('Promo-kod olib tashlandi');
  render();
}

function goCheckout(){
  if(cartCount()===0){toast('Savat bo\'sh','e');return;}
  location.href='checkout.html';
}

var _cmCallback=null;
function openCm(ico,t,d,okText,cb){
  document.getElementById('cmIco').textContent=ico;
  document.getElementById('cmT').textContent=t;
  document.getElementById('cmD').textContent=d;
  document.getElementById('cmOk').textContent=okText||'Tasdiqlash';
  _cmCallback=cb;
  document.getElementById('cm').classList.add('on');
}
function closeCm(){document.getElementById('cm').classList.remove('on');_cmCallback=null;}
function cmConfirm(){if(_cmCallback)_cmCallback();closeCm();}

function render(){
  var content=document.getElementById('content');
  var bbar=document.getElementById('bbar');
  var editBtn=document.getElementById('editBtn');
  
  updateCartBadge();
  
  if(!S.cart.length){
    document.getElementById('pageCount').textContent='';
    editBtn.style.display='none';
    bbar.style.display='none';
    content.innerHTML='<div class="empty">'+
      '<div class="ic">🛒</div>'+
      '<h3>Savat bo\'sh</h3>'+
      '<p>Mahsulot qidirib, savatga qo\'shing</p>'+
      '<button onclick="location.href=\'search.html\'">🔍 Xarid qilish</button>'+
    '</div>';
    return;
  }
  
  var cnt=cartCount();
  document.getElementById('pageCount').textContent='('+cnt+' ta)';
  editBtn.style.display='block';
  bbar.style.display='block';
  
  var h='';
  
  h+='<div class="sec">'+
    '<div class="sech"><div class="sect">📦 Mahsulotlar <span>'+cnt+' ta</span></div></div>'+
    '<div class="secb">';
  
  S.cart.forEach(function(it){
    var key=it.cartKey||it.id;
    var qty=Number(it.qty)||1;
    var sum=(Number(it.price)||0)*qty;
    var img=it.images&&it.images[0]?'<img src="'+it.images[0]+'">':(it.emoji||'📦');
    
    h+='<div class="item">'+
      '<div class="icover">'+img+'</div>'+
      '<div class="ibody">'+
        '<div class="iname">'+esc(it.name)+'</div>'+
        (it.variantText?'<div class="ivar">'+esc(it.variantText)+'</div>':'')+
        (it.shop?'<div class="ishop">🏪 '+esc(it.shop)+'</div>':'')+
        '<div class="iprice">'+fmt(it.price)+'</div>'+
        '<div class="ifoot">'+
          '<div class="qty">'+
            '<button class="qbtn minus" onclick="changeQty(\''+esc(key)+'\',-1)">−</button>'+
            '<span class="qnum">'+qty+'</span>'+
            '<button class="qbtn plus" onclick="changeQty(\''+esc(key)+'\',1)">+</button>'+
          '</div>'+
          '<div class="isum">'+fmt(sum)+'</div>'+
          '<button class="irm" onclick="removeItem(\''+esc(key)+'\')">🗑</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  });
  h+='</div></div>';
  
  h+='<div class="promo'+(S.promo?' ok':'')+'">';
  if(S.promo){
    var dText=S.promo.type==='percent'?S.promo.value+'% chegirma':fmt(S.promo.value)+' chegirma';
    h+='<div class="promo-head">'+
      '<span class="ic">🎁</span>'+
      '<span class="t">Promo-kod qo\'llandi</span>'+
      '<span class="b">'+esc(S.promo.code)+'</span>'+
    '</div>'+
    '<div class="promo-applied">'+
      '<div class="promo-info">'+dText+' (−'+fmt(discountAmount())+')</div>'+
      '<button class="promo-rm" onclick="removePromo()">✕ Olib tashlash</button>'+
    '</div>';
  }else{
    h+='<div class="promo-head">'+
      '<span class="ic">🎁</span>'+
      '<span class="t">Promo-kod</span>'+
    '</div>'+
    '<div class="promo-row">'+
      '<input class="promo-input" id="promoInput" placeholder="Kodni kiriting..." maxlength="20" onkeydown="if(event.key===\'Enter\'){event.preventDefault();applyPromo();}">'+
      '<button class="promo-btn" onclick="applyPromo()">Qo\'llash</button>'+
    '</div>'+
    '<div class="promo-err" id="promoErr"></div>'+
    '<div class="promo-hint">Sinab ko\'ring: <b onclick="fillPromo(\'RAYIS10\')">RAYIS10</b> · <b onclick="fillPromo(\'RAYIS20\')">RAYIS20</b> · <b onclick="fillPromo(\'YANGI50\')">YANGI50</b> · <b onclick="fillPromo(\'BEPUL10K\')">BEPUL10K</b></div>';
  }
  h+='</div>';
  
  var sub=productsTotal();
  var disc=discountAmount();
  var total=grandTotal();
  h+='<div class="sec">'+
    '<div class="sech"><div class="sect">💰 Hisob-kitob</div></div>'+
    '<div class="secb">'+
      '<div class="deliv-row"><span class="l">Mahsulotlar:</span><span class="v">'+fmt(sub)+'</span></div>'+
      (disc>0?'<div class="deliv-row disc"><span class="l">🎁 Chegirma ('+esc(S.promo.code)+'):</span><span class="v">−'+fmt(disc)+'</span></div>':'')+
      '<div class="deliv-row"><span class="l">🚚 Yetkazish:</span><span class="v" style="color:var(--pri2)">Bepul</span></div>'+
      '<div class="deliv-row total"><span class="l">Jami:</span><span class="v">'+fmt(total)+'</span></div>'+
    '</div>'+
  '</div>';
  
  content.innerHTML=h;
  document.getElementById('totalVal').textContent=fmt(total);
}

function fillPromo(code){
  var inp=document.getElementById('promoInput');
  if(inp){inp.value=code;inp.focus();}
}

function setupListeners(){
  DB.on('cart',function(val){
    S.cart=toArray(val);
    render();
  });
  DB.on('promo',function(val){
    if(val&&val.code)S.promo=val;
    else S.promo=null;
    render();
  });
}

function init(){
  var th=DB.get('theme','dark');
  document.body.dataset.t=th;
  
  S.user=DB.get('user',{});
  S.cart=toArray(DB.get('cart',[]));
  S.promo=DB.get('promo',null);
  
  if(DB.isReady())onReady();
  else{
    window.addEventListener('db:ready',onReady);
    setTimeout(function(){
      if(!S.cart.length){
        updateDbStatus('offline','💾 Offline rejim');
        loadLocal();
      }
    },3000);
  }
  
  window.addEventListener('db:connection',function(e){
    updateDbStatus(e.detail.online?'online':'offline',e.detail.online?'🟢 Online':'🔴 Offline');
  });
}

function onReady(){
  console.log('🔥 Firebase tayyor');
  updateDbStatus('online','🟢 Online — real-time');
  
  DB.syncAll().then(function(){
    S.cart=toArray(DB.get('cart',[]));
    S.promo=DB.get('promo',null);
    
    if(!S.cart.length){
      loadLocal();
    }else{
      setupListeners();
      render();
    }
  });
}

function loadLocal(){
  try{
    var old=JSON.parse(localStorage.getItem('rayis_cart')||'[]');
    if(Array.isArray(old)&&old.length){
      S.cart=old;
      console.log('[Cart] localStorage:',old.length);
    }
  }catch(e){}
  
  setupListeners();
  render();
}

init();
console.log('✅ Cart sahifasi — Firebase bilan');
</script>
</body>
</html>
