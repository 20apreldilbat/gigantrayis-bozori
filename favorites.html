<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0B1119">
<title>Sevimlilar — RAYIS BOZORI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>

<style>
:root{
  --bg:#0B1119;--surf:#151C26;--surf2:#1E2733;--brd:#2A3441;
  --tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;
  --pri:#10B981;--pri2:#34D399;--priS:#064E3B;
  --acc:#3B82F6;--accS:#1E3A8A;
  --er:#EF4444;--wn:#F59E0B;--pu:#8B5CF6;
  --r1:8px;--r2:12px;--r3:16px;--r4:24px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-t="light"]{
  --bg:#F5F7FA;--surf:#FFFFFF;--surf2:#EEF2F7;--brd:#E2E8F0;
  --tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;
  --pri:#059669;--pri2:#10B981;--priS:#ECFDF5;
  --acc:#2563EB;--accS:#EFF6FF;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:100px;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}

.app{max-width:640px;margin:0 auto;padding:14px}
.hdr{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r3);padding:12px;margin-bottom:14px;position:sticky;top:8px;z-index:40;display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border-radius:var(--r2);background:var(--surf2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--tx);flex-shrink:0}
.back:active{transform:scale(.92)}
.htitle{flex:1;font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px}
.htitle .badge{font-size:11px;color:#EC4899;background:rgba(236,72,153,.15);padding:3px 9px;border-radius:20px;font-weight:800}
.hbtn{width:42px;height:42px;border-radius:var(--r2);background:var(--surf2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--er);flex-shrink:0}
.hbtn:active{transform:scale(.92)}

.db-status{margin:0 4px 14px;padding:8px 12px;border-radius:var(--r2);font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px}
.db-status.connecting{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#FBBF24}
.db-status.online{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#34D399}
.db-status.offline{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#F87171}
.db-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.toolbar{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 12px;gap:10px}
.toolbar .info{font-size:12px;color:var(--tx2);font-weight:600}
.sortbtn{padding:8px 14px;background:var(--surf);border:1px solid var(--brd);border-radius:var(--r2);font-size:12px;font-weight:700;color:var(--tx);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
.sortbtn.on{border-color:var(--pri2);color:var(--pri2);background:var(--priS)}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r2);overflow:hidden;cursor:pointer;position:relative}
.pcard:active{transform:scale(.98)}
.pimg{width:100%;aspect-ratio:1;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg .heart{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#EC4899;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;backdrop-filter:blur(4px)}
.pimg .disc{position:absolute;top:8px;left:8px;background:var(--er);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px}
.pimg .out{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.pinfo{padding:10px}
.pn{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:5px;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prt{display:flex;align-items:center;gap:3px;font-size:11px;margin-bottom:6px}
.prt .st{color:#F59E0B}
.prt .num{color:#F59E0B;font-weight:800}
.prt .cnt{color:var(--tx3)}
.ppr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pp{font-size:15px;font-weight:900;color:var(--pri2)}
.pold{font-size:11px;color:var(--tx3);text-decoration:line-through}
.pshop{font-size:10px;color:var(--wn);font-weight:600;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.padd{width:100%;padding:9px;background:linear-gradient(135deg,var(--pri2),var(--pri));border:none;border-radius:var(--r1);color:#fff;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.padd.incart{background:linear-gradient(135deg,#3B82F6,#2563EB)}
.padd:disabled{opacity:.4;cursor:not-allowed}

.empty{text-align:center;padding:70px 20px;color:var(--tx3)}
.empty .ic{font-size:80px;margin-bottom:16px;opacity:.4}
.empty h3{font-size:18px;font-weight:800;color:var(--tx2);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.6;margin-bottom:22px}
.empty button{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border:none;padding:14px 28px;border-radius:var(--r2);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}

.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--brd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--safe-b));z-index:100;max-width:640px;margin:0 auto}
.nb{background:none;border:none;color:var(--tx3);font-size:10px;font-weight:600;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;position:relative;font-family:inherit}
.nb.on{color:var(--pri2)}
.nb:active{transform:scale(.92)}
.nb .ic{font-size:22px}
.nb .cnt{position:absolute;top:0;right:20%;background:var(--er);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surf)}

.tst{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:100px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.e{background:var(--er);color:#fff}
.tst.o{background:var(--pri);color:#fff}

.md{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.md.on{display:flex}
.mbox{background:var(--surf);border-radius:var(--r3);padding:24px;max-width:380px;width:100%;text-align:center}
.mico{font-size:48px;margin-bottom:12px}
.mt{font-size:17px;font-weight:800;margin-bottom:6px}
.mdd{font-size:14px;color:var(--tx2);line-height:1.5;margin-bottom:20px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{padding:14px;border-radius:var(--r2);font-size:14px;font-weight:800;cursor:pointer;border:none;font-family:inherit}
.mbtn.g{background:var(--surf2);color:var(--tx);border:1px solid var(--brd)}
.mbtn.r{background:var(--er);color:#fff}

.sk{background:linear-gradient(90deg,var(--surf) 25%,var(--surf2) 50%,var(--surf) 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:var(--r2);aspect-ratio:.7}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body data-t="dark">

<div class="app">
  <div class="hdr">
    <button class="back" onclick="goBack()">←</button>
    <div class="htitle">❤️ Sevimlilar <span class="badge" id="hdrCount">0</span></div>
    <button class="hbtn" onclick="clearAll()" id="clearBtn" style="display:none">🗑</button>
  </div>

  <div class="db-status connecting" id="dbStatus">
    <span class="dot"></span><span id="dbText">Firebase ulanmoqda...</span>
  </div>

  <div class="toolbar">
    <div class="info" id="toolbarInfo">Barcha saqlangan mahsulotlar</div>
    <button class="sortbtn" id="sortBtn" onclick="toggleSort()" style="display:none">
      <span>💰</span><span id="sortLabel">Arzon → Qimmat</span>
    </button>
  </div>

  <div id="content">
    <div class="pgrid">
      <div class="sk"></div>
      <div class="sk"></div>
      <div class="sk"></div>
      <div class="sk"></div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nb" onclick="location.href='home.html'"><span class="ic">🏠</span><span>Bosh</span></button>
  <button class="nb" onclick="location.href='search.html'"><span class="ic">🔍</span><span>Qidiruv</span></button>
  <button class="nb" onclick="location.href='cart.html'"><span class="ic">🛒</span><span>Savat</span><span class="cnt" id="navCartCnt" style="display:none">0</span></button>
  <button class="nb" onclick="location.href='orders.html'"><span class="ic">📦</span><span>Buyurtma</span></button>
  <button class="nb on"><span class="ic">❤️</span><span>Sevimli</span></button>
</div>

<div class="md" id="md" onclick="if(event.target.id==='md')closeMd()">
  <div class="mbox">
    <div class="mico" id="mIco">🗑</div>
    <div class="mt" id="mT">Tasdiqlaysizmi?</div>
    <div class="mdd" id="mD">—</div>
    <div class="mbtns">
      <button class="mbtn g" onclick="closeMd()">Bekor</button>
      <button class="mbtn r" id="mOk" onclick="mdConfirm()">Tasdiqlash</button>
    </div>
  </div>
</div>

<div class="tst" id="tst"></div>

<script>
var S={
  products:[],
  favs:[],
  cart:[],
  sortAsc:true
};

function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){
  var e=document.getElementById('tst');
  e.textContent=m;
  e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');
  clearTimeout(e._t);
  e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':tp==='o'?' o':'');},2400);
}
function goBack(){if(history.length>1)history.back();else location.href='home.html';}
function updateDbStatus(cls,text){
  var el=document.getElementById('dbStatus');
  if(!el)return;
  el.className='db-status '+cls;
  document.getElementById('dbText').textContent=text;
}
function toArray(val){
  if(!val)return[];
  if(Array.isArray(val))return val;
  if(typeof val==='object')return Object.values(val);
  return[];
}

function isInCart(id){
  return S.cart.some(function(c){return String(c.id)===String(id);});
}
async function addCart(id,ev){
  if(ev)ev.stopPropagation();
  var p=S.products.find(function(x){return String(x.id)===String(id);});
  if(!p)return toast('Topilmadi','e');
  if(p.stock<=0)return toast('Tugagan','e');
  var ex=S.cart.find(function(c){return String(c.id)===String(id);});
  if(ex){ex.qty=(ex.qty||1)+1;}
  else{
    S.cart.push({
      id:p.id,name:p.name,price:p.price,unit:p.unit||'dona',
      emoji:p.emoji||'📦',images:p.images||[],
      shop:p.shopName||'',qty:1
    });
  }
  try{await DB.set('cart',S.cart);}catch(e){}
  updateCartBadge();
  toast('✅ Savatga qo\'shildi','o');
}

function updateCartBadge(){
  var cnt=S.cart.reduce(function(s,i){return s+(Number(i.qty)||0);},0);
  var el=document.getElementById('navCartCnt');
  if(el){
    if(cnt>0){el.textContent=cnt>99?'99+':cnt;el.style.display='flex';}
    else el.style.display='none';
  }
}

async function removeFav(id,ev){
  if(ev)ev.stopPropagation();
  S.favs=S.favs.filter(function(x){return String(x)!==String(id);});
  try{await DB.set('favs',S.favs);}catch(e){}
  toast('💔 Sevimlilardan olindi','o');
  render();
}

var _pendingAction=null;
function openMd(ico,t,d,okText,cb){
  document.getElementById('mIco').textContent=ico;
  document.getElementById('mT').textContent=t;
  document.getElementById('mD').textContent=d;
  document.getElementById('mOk').textContent=okText||'Tasdiqlash';
  _pendingAction=cb;
  document.getElementById('md').classList.add('on');
}
function closeMd(){document.getElementById('md').classList.remove('on');_pendingAction=null;}
function mdConfirm(){if(_pendingAction)_pendingAction();closeMd();}

function clearAll(){
  if(!S.favs.length)return;
  openMd('🗑','Sevimlilarni tozalash','Barcha saqlangan mahsulotlar o\'chiriladi.\nBu amalni qaytarib bo\'lmaydi.','Tozalash',async function(){
    S.favs=[];
    try{await DB.set('favs',[]);}catch(e){}
    toast('🗑 Tozalandi','o');
    render();
  });
}

function toggleSort(){
  S.sortAsc=!S.sortAsc;
  document.getElementById('sortLabel').textContent=S.sortAsc?'Arzon → Qimmat':'Qimmat → Arzon';
  document.getElementById('sortBtn').classList.toggle('on',!S.sortAsc);
  render();
}

function render(){
  var products=S.products;
  if(!Array.isArray(products))products=toArray(products);
  
  var items=products.filter(function(p){
    return p && p.name && S.favs.indexOf(p.id)!==-1;
  });
  
  items.sort(function(a,b){return S.sortAsc?a.price-b.price:b.price-a.price;});
  
  document.getElementById('hdrCount').textContent=items.length;
  document.getElementById('clearBtn').style.display=items.length?'flex':'none';
  document.getElementById('sortBtn').style.display=items.length?'flex':'none';
  document.getElementById('toolbarInfo').textContent=items.length?(items.length+' ta mahsulot'):'';
  
  updateCartBadge();
  
  var c=document.getElementById('content');
  
  if(!items.length){
    c.innerHTML='<div class="empty">'+
      '<div class="ic">💔</div>'+
      '<h3>Sevimlilar bo\'sh</h3>'+
      '<p>Mahsulotlardagi yurakchani bosib saqlang — ular shu yerda ko\'rinadi</p>'+
      '<button onclick="location.href=\'search.html\'">🔍 Mahsulot qidirish</button>'+
    '</div>';
    return;
  }
  
  var h='<div class="pgrid">';
  items.forEach(function(p){h+=card(p);});
  h+='</div>';
  c.innerHTML=h;
}

function card(p){
  var inCart=isInCart(p.id);
  var disc=p.oldPrice&&p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
  var rt=p.rt||5, rc=p.rc||0;
  var ratingHtml=rc>0
    ?'<div class="prt"><span class="st">⭐</span><span class="num">'+Number(rt).toFixed(1)+'</span><span class="cnt">('+rc+')</span></div>'
    :'<div class="prt"><span style="color:var(--tx3)">☆☆☆☆☆ Sharh yo\'q</span></div>';
  var oldPrice=p.oldPrice&&p.oldPrice>p.price?'<span class="pold">'+fmt(p.oldPrice)+'</span>':'';
  var discBadge=disc>0?'<div class="disc">-'+disc+'%</div>':'';
  var outStock=p.stock<=0?'<div class="out">Tugagan</div>':'';
  var img=p.images&&p.images[0]?'<img src="'+p.images[0]+'">':(p.emoji||'📦');
  
  return '<div class="pcard" onclick="location.href=\'product.html?id='+p.id+'\'">'+
    '<div class="pimg">'+img+discBadge+
      '<div class="heart" onclick="event.stopPropagation();removeFav(\''+p.id+'\',event)">❤️</div>'+
      outStock+
    '</div>'+
    '<div class="pinfo">'+
      '<div class="pn">'+esc(p.name)+'</div>'+
      ratingHtml+
      '<div class="ppr"><span class="pp">'+fmt(p.price)+'</span>'+oldPrice+'</div>'+
      (p.shopName?'<div class="pshop">🏪 '+esc(p.shopName)+'</div>':'')+
      '<button class="padd '+(inCart?'incart':'')+'" onclick="event.stopPropagation();addCart(\''+p.id+'\',event)" '+(p.stock<=0?'disabled':'')+'>'+
        (p.stock<=0?'❌ Tugagan':(inCart?'✅ Savatda':'🛒 Savatga'))+
      '</button>'+
    '</div>'+
  '</div>';
}

function setupListeners(){
  DB.on('products',function(val){
    S.products=toArray(val).filter(function(p){return p&&p.name;});
    render();
  });
  DB.on('favs',function(val){
    S.favs=toArray(val);
    render();
  });
  DB.on('cart',function(val){
    S.cart=toArray(val);
    updateCartBadge();
    render();
  });
}

function init(){
  var th=DB.get('theme','dark');
  document.body.dataset.t=th;
  
  S.products=toArray(DB.get('products',[])).filter(function(p){return p&&p.name;});
  S.favs=toArray(DB.get('favs',[]));
  S.cart=toArray(DB.get('cart',[]));
  
  render();
  
  if(DB.isReady())onReady();
  else{
    window.addEventListener('db:ready',onReady);
    setTimeout(function(){
      updateDbStatus('offline','💾 Offline rejim');
    },3000);
  }
  
  window.addEventListener('db:connection',function(e){
    updateDbStatus(e.detail.online?'online':'offline',e.detail.online?'🟢 Online':'🔴 Offline');
  });
}

function onReady(){
  console.log('🔥 Firebase tayyor');
  updateDbStatus('online','🟢 Online — real-time');
  
  DB.syncAll().then(function(){
    S.products=toArray(DB.get('products',[])).filter(function(p){return p&&p.name;});
    S.favs=toArray(DB.get('favs',[]));
    S.cart=toArray(DB.get('cart',[]));
    setupListeners();
    render();
  });
}

init();
console.log('✅ Favorites sahifasi — Firebase bilan');
</script>
</body>
</html>
