<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Sotuvchi paneli — RAYIS BOZORI</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
:root{--bg:#0B1119;--surf:#151C26;--surf2:#1E2733;--brd:#2A3441;--tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;--pri:#10B981;--pri2:#34D399;--priS:#064E3B;--acc:#3B82F6;--accS:#1E3A8A;--er:#EF4444;--wn:#F59E0B;--pu:#8B5CF6;--r1:8px;--r2:12px;--r3:16px;--r4:24px;--safe-b:env(safe-area-inset-bottom,0px)}
[data-t="light"]{--bg:#F5F7FA;--surf:#FFFFFF;--surf2:#EEF2F7;--brd:#E2E8F0;--tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;--pri:#059669;--pri2:#10B981;--priS:#ECFDF5;--acc:#2563EB;--accS:#EFF6FF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:100px;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.app{max-width:640px;margin:0 auto;padding:14px}
.hdr{background:linear-gradient(135deg,#3B82F6,#2563EB);border-radius:var(--r3);padding:14px;margin-bottom:14px;position:sticky;top:8px;z-index:40;box-shadow:0 4px 20px rgba(59,130,246,.3)}
.htop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand-r{width:38px;height:38px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#2563EB}
.brand-t{font-size:15px;font-weight:800;color:#fff;line-height:1.1}
.brand-t span{color:rgba(255,255,255,.7)}
.brand-s{font-size:10px;color:rgba(255,255,255,.7);letter-spacing:.1em;margin-top:2px}
.hbtn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 12px;border-radius:var(--r2);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.hinfo{display:flex;align-items:center;gap:10px;color:#fff;font-size:12px}
.hinfo .av{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px}
.hinfo .nm{font-weight:800}
.hinfo .badge{background:#fff;color:#2563EB;font-size:9px;font-weight:900;padding:2px 6px;border-radius:6px}
.db-status{margin:0 4px 14px;padding:8px 12px;border-radius:var(--r2);font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px}
.db-status.connecting{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#FBBF24}
.db-status.online{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#34D399}
.db-status.offline{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#F87171}
.db-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 16px;background:var(--surf);border:1px solid var(--brd);border-radius:20px;font-size:13px;font-weight:700;color:var(--tx2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:inherit;position:relative}
.tab.on{background:var(--priS);border-color:var(--pri2);color:var(--pri2);font-weight:800}
.tab .badge{background:var(--er);color:#fff;font-size:9px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r2);padding:14px}
.kpi .v{font-size:24px;font-weight:900;color:var(--acc);line-height:1}
.kpi .v.green{color:var(--pri2)}
.kpi .v.yellow{color:var(--wn)}
.kpi .v.purple{color:var(--pu)}
.kpi .l{font-size:11px;color:var(--tx2);margin-top:6px;font-weight:700;text-transform:uppercase}
.sec{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r3);margin-bottom:14px;overflow:hidden}
.sech{padding:14px 16px;background:var(--surf2);border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
.sect{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.sect .num{width:22px;height:22px;border-radius:50%;background:var(--priS);color:var(--pri2);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.secb{padding:16px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.flabel{display:block;font-size:13px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.flabel .hint{font-size:11px;color:var(--tx3);font-weight:500}
.finput,.fselect,.ftextarea{width:100%;padding:14px;background:var(--surf2);border:2px solid transparent;border-radius:var(--r2);color:var(--tx);font-size:15px;font-family:inherit;outline:none;transition:.2s;font-weight:500}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--pri2);background:var(--surf)}
.finput::placeholder,.ftextarea::placeholder{color:var(--tx3);font-weight:400}
.ftextarea{resize:vertical;min-height:80px}
.fselect{-webkit-appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='%2394A3B8'><path d='M8 12L2 6h12z'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgup{border:2px dashed var(--brd);border-radius:var(--r2);padding:20px;text-align:center;cursor:pointer;background:var(--surf2);transition:.2s}
.imgup:active{border-color:var(--pri2);background:var(--priS)}
.imgup .ic{font-size:32px;margin-bottom:6px}
.imgup .t{font-size:13px;font-weight:800;color:var(--pri2)}
.imgup .h{font-size:11px;color:var(--tx3);margin-top:4px}
.imgprev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.imgpv{position:relative;aspect-ratio:1;border-radius:var(--r2);overflow:hidden;background:var(--surf2);border:1px solid var(--brd)}
.imgpv img{width:100%;height:100%;object-fit:cover}
.imgpv .rm{position:absolute;top:4px;right:4px;background:var(--er);color:#fff;width:24px;height:24px;border-radius:50%;font-size:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.imgpv .up{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-direction:column;gap:4px}
.btn{padding:14px;border-radius:var(--r2);font-size:14px;font-weight:800;cursor:pointer;border:none;font-family:inherit;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bp{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff}
.bg{background:var(--surf2);color:var(--tx);border:1px solid var(--brd)}
.ba{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff}
.br{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff}
.bgr{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff}
.bsm{padding:10px 14px;font-size:12px;width:auto;min-height:auto}
.prow{display:flex;gap:12px;padding:12px;background:var(--surf2);border-radius:var(--r2);margin-bottom:8px;align-items:center}
.prow .img{width:60px;height:60px;border-radius:var(--r2);background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
.prow .img img{width:100%;height:100%;object-fit:cover}
.prow .info{flex:1;min-width:0}
.prow .n{font-size:13px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .m{font-size:11px;color:var(--tx2);margin-bottom:3px}
.prow .p{font-size:14px;font-weight:900;color:var(--pri2)}
.prow .act{display:flex;gap:6px;flex-shrink:0}
.prow .abtn{width:36px;height:36px;border-radius:var(--r2);border:1px solid var(--brd);background:var(--surf);color:var(--tx);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.prow .abtn.edit{background:rgba(59,130,246,.15);color:#60A5FA}
.prow .abtn.del{background:rgba(239,68,68,.15);color:#F87171}
.order{background:var(--surf2);border-radius:var(--r2);padding:14px;margin-bottom:10px;border-left:3px solid var(--wn)}
.order.new{border-left-color:var(--acc);background:linear-gradient(90deg,rgba(59,130,246,.06),var(--surf2))}
.order.done{border-left-color:var(--pri2);opacity:.85}
.order.cancel{border-left-color:var(--er);opacity:.7}
.order-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.order-h .id{font-size:12px;font-weight:900;color:var(--acc);word-break:break-all}
.order-h .date{font-size:10px;color:var(--tx3);margin-top:2px}
.order-h .badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}
.badge.new{background:rgba(59,130,246,.15);color:#60A5FA}
.badge.acc{background:rgba(139,92,246,.15);color:#A78BFA}
.badge.way{background:rgba(245,158,11,.15);color:#FBBF24}
.badge.done{background:rgba(16,185,129,.15);color:#34D399}
.badge.cancel{background:rgba(239,68,68,.15);color:#F87171}
.order-cust{font-size:12px;color:var(--tx2);line-height:1.7;padding:10px;background:var(--surf);border-radius:var(--r2);margin-bottom:10px}
.order-cust b{color:var(--tx);font-weight:700}
.order-item{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--tx2);gap:10px}
.order-item .n{flex:1;color:var(--tx)}
.order-item .p{color:var(--pri2);font-weight:700;white-space:nowrap}
.order-total{display:flex;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--brd);font-size:14px;font-weight:900}
.order-total .v{color:var(--pri2);font-size:18px}
.order-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.order-acts .btn{flex:1;min-width:100px;font-size:12px;padding:10px}
.empty{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty .ic{font-size:64px;margin-bottom:14px;opacity:.4}
.empty h3{font-size:16px;font-weight:800;color:var(--tx2);margin-bottom:8px}
.empty p{font-size:13px;line-height:1.6;margin-bottom:16px}
.empty button{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border:none;padding:12px 24px;border-radius:var(--r2);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.open-shop{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r3);padding:24px 20px;text-align:center}
.open-shop .ic{font-size:60px;margin-bottom:12px}
.open-shop .t{font-size:20px;font-weight:900;margin-bottom:6px}
.open-shop .d{font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:20px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--brd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--safe-b));z-index:100;max-width:640px;margin:0 auto}
.nb{background:none;border:none;color:var(--tx3);font-size:10px;font-weight:600;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;font-family:inherit}
.nb.on{color:var(--pri2)}
.nb .ic{font-size:22px}
.tst{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:100px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.e{background:var(--er);color:#fff}
.tst.o{background:var(--pri);color:#fff}
.md{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.md.on{display:flex}
.mbox{background:var(--surf);border-radius:var(--r3);padding:24px;max-width:380px;width:100%;text-align:center}
.mico{font-size:48px;margin-bottom:12px}
.mt{font-size:17px;font-weight:800;margin-bottom:6px}
.mdd{font-size:14px;color:var(--tx2);line-height:1.5;margin-bottom:20px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{padding:14px;border-radius:var(--r2);font-size:14px;font-weight:800;cursor:pointer;border:none;font-family:inherit}
.mbtn.g{background:var(--surf2);color:var(--tx);border:1px solid var(--brd)}
.mbtn.r{background:var(--er);color:#fff}
.sk{background:linear-gradient(90deg,var(--surf) 25%,var(--surf2) 50%,var(--surf) 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:var(--r3);height:120px;margin-bottom:12px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>

<div class="app">

<script>
var CATS=[
{id:'oziq',n:'Oziq-ovqat',e:'🍎'},{id:'kiyim',n:'Kiyim',e:'👕'},
{id:'poyabzal',n:'Poyabzal',e:'👟'},{id:'elektr',n:'Elektronika',e:'📱'},
{id:'texnika',n:'Texnika',e:'🔌'},{id:'mebel',n:'Mebel',e:'🛋'},
{id:'qurilish',n:'Qurilish',e:'🧱'},{id:'gozal',n:'Go\'zallik',e:'💄'},
{id:'bola',n:'Bolalar',e:'🧸'},{id:'sport',n:'Sport',e:'⚽'},
{id:'kitob',n:'Kitob',e:'📚'},{id:'kimyo',n:'Kimyo',e:'🧴'},
{id:'dori',n:'Dori',e:'💊'},{id:'hayvon',n:'Hayvonlar',e:'🐾'},
{id:'boshqa',n:'Boshqa',e:'📦'}
];
var UNITS=['dona','kg','g','litr','ml','m','m²','m³','qop','paket','juft','tonna','komplekt','bosh','list'];
var S={tab:'dash',user:{},shop:null,products:[],orders:[],editId:null,imgBuffers:[],uploading:false};
function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){var e=document.getElementById('tst');e.textContent=m;e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');clearTimeout(e._t);e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':tp==='o'?' o':'');},2400);}
function updateDbStatus(cls,text){var el=document.getElementById('dbStatus');if(!el)return;el.className='db-status '+cls;document.getElementById('dbText').textContent=text;}
function toArray(val){if(!val)return[];if(Array.isArray(val))return val;if(typeof val==='object')return Object.values(val);return[];}
function uid(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function fmtDate(iso){if(!iso)return '—';try{var d=new Date(iso);var pad=function(n){return String(n).padStart(2,'0');};return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}catch(e){return '—';}}
function render(){
if(!S.user||!S.user.firstName){document.getElementById('content').innerHTML='<div class="empty"><div class="ic">🔐</div><h3>Kirish kerak</h3><p>Sotuvchi panelidan foydalanish uchun tizimga kiring</p><button onclick="location.href=\'index.html\'">🔐 Kirish</button></div>';return;}
S.shop=S.shop||null;
document.getElementById('shopNameHeader').textContent=S.shop?S.shop.name:'Do\'kon ochilmagan';
if(!S.shop){renderOpenShop();return;}
var h='';h+=renderTabs();
if(S.tab==='dash')h+=renderDash();
else if(S.tab==='add')h+=renderAdd();
else if(S.tab==='list')h+=renderList();
else if(S.tab==='orders')h+=renderOrders();
document.getElementById('content').innerHTML=h;
}
function renderOpenShop(){
S.imgBuffers=[];
var h='<div class="open-shop"><div class="ic">🏪</div><div class="t">Do\'kon ochish</div><div class="d">Mahsulot qo\'shishdan oldin<br>o\'z do\'koningizni oching</div></div>'+
'<div class="sec" style="margin-top:14px"><div class="sech"><div class="sect"><span class="num">1</span>Do\'kon ma\'lumotlari</div></div><div class="secb">'+
'<div class="field"><label class="flabel">Do\'kon nomi *</label><input class="finput" id="shopName" placeholder="Masalan: Oziq Bozor" maxlength="60"></div>'+
'<div class="field"><label class="flabel">Manzil *</label><input class="finput" id="shopAddr" placeholder="Qumqorgon sh., ..." maxlength="120"></div>'+
'<div class="field"><label class="flabel">Telefon *</label><input class="finput" id="shopPhone" type="tel" placeholder="+998 90 123 45 67" maxlength="20"></div>'+
'<div class="field"><label class="flabel">Tavsif</label><textarea class="ftextarea" id="shopDesc" placeholder="Do\'kon haqida..." maxlength="200"></textarea></div>'+
'<div class="field"><label class="flabel">Kategoriya *</label><select class="fselect" id="shopCat"><option value="">Tanlang...</option>'+CATS.map(function(c){return '<option value="'+c.id+'">'+c.e+' '+esc(c.n)+'</option>';}).join('')+'</select></div>'+
'<div class="field"><label class="flabel">Logo (ixtiyoriy)</label><div class="imgup" onclick="document.getElementById(\'shopImg\').click()"><div class="ic">📷</div><div class="t">Rasm tanlash</div><div class="h">JPG, PNG · 5MB gacha</div></div><input type="file" id="shopImg" accept="image/*" style="display:none" onchange="pickShopImg(event)"><div class="imgprev" id="shopImgPrev"></div></div>'+
'<button class="btn bp" onclick="openShop()">🏪 Do\'kon ochish</button></div></div>';
document.getElementById('content').innerHTML=h;
}
async function pickShopImg(e){
var f=e.target.files[0];if(!f)return;
if(f.size>5*1024*1024){toast('Rasm 5MB dan katta','e');return;}
var prev=document.getElementById('shopImgPrev');
prev.innerHTML='<div class="imgpv"><div class="up"><div>⏳</div></div></div>';
try{var res=await DB.uploadImage(f,'shops');S.imgBuffers=[res.url];prev.innerHTML='<div class="imgpv"><img src="'+res.url+'"><button class="rm" onclick="rmShopImg()">✕</button></div>';toast('✅ Yuklandi','o');}
catch(err){prev.innerHTML='';toast('Xato: '+(err.message||''),'e');}
e.target.value='';
}
function rmShopImg(){S.imgBuffers=[];document.getElementById('shopImgPrev').innerHTML='';}
async function openShop(){
var n=(document.getElementById('shopName').value||'').trim();
var a=(document.getElementById('shopAddr').value||'').trim();
var p=(document.getElementById('shopPhone').value||'').trim();
var d=(document.getElementById('shopDesc').value||'').trim();
var c=document.getElementById('shopCat').value;
if(n.length<2)return toast('Nom kiriting','e');
if(a.length<3)return toast('Manzil kiriting','e');
if(p.replace(/\D/g,'').length<7)return toast('Telefon kiriting','e');
if(!c)return toast('Kategoriya tanlang','e');
var shop={id:uid('shop'),name:n,address:a,phone:p,description:d,category:c,logo:S.imgBuffers[0]||null,ownerId:S.user.userId,ownerName:S.user.name,verified:false,rating:5.0,reviewCount:0,createdAt:new Date().toISOString()};
try{var shops=toArray(DB.get('shops',[]));shops.push(shop);await DB.set('shops',shops);S.shop=shop;S.imgBuffers=[];toast('✅ Do\'kon ochildi!','o');setTimeout(render,400);}
catch(e){toast('Xato: '+(e.message||''),'e');}
}
function renderTabs(){
var newOrders=countNewOrders();
return '<div class="tabs">'+
'<button class="tab '+(S.tab==='dash'?'on':'')+'" onclick="setTab(\'dash\')">📊 Panel</button>'+
'<button class="tab '+(S.tab==='add'?'on':'')+'" onclick="setTab(\'add\')">➕ Qo\'shish</button>'+
'<button class="tab '+(S.tab==='list'?'on':'')+'" onclick="setTab(\'list\')">📦 Mahsulotlar</button>'+
'<button class="tab '+(S.tab==='orders'?'on':'')+'" onclick="setTab(\'orders\')">📋 Buyurtmalar'+(newOrders>0?'<span class="badge">'+newOrders+'</span>':'')+'</button>'+
'</div>';
}
function setTab(t){S.tab=t;S.editId=null;S.imgBuffers=[];render();window.scrollTo({top:0,behavior:'smooth'});}
function countNewOrders(){if(!S.shop)return 0;return myOrders().filter(function(o){return o.status==='yangi';}).length;}
function myOrders(){if(!S.shop)return[];var myProdIds=S.products.map(function(p){return String(p.id);});return S.orders.filter(function(o){if(!o.items)return false;return o.items.some(function(it){return myProdIds.indexOf(String(it.id))!==-1;});});}
function renderDash(){
var products=S.products;
var orders=myOrders();
var newOrders=orders.filter(function(o){return o.status==='yangi';});
var totalRevenue=orders.filter(function(o){return o.status==='yetkazildi';}).reduce(function(s,o){return s+(Number(o.total)||0);},0);
var h='<div class="kpis"><div class="kpi"><div class="v">'+products.length+'</div><div class="l">Mahsulotlar</div></div><div class="kpi"><div class="v yellow">'+newOrders.length+'</div><div class="l">Yangi</div></div><div class="kpi"><div class="v green">'+orders.length+'</div><div class="l">Jami</div></div><div class="kpi"><div class="v purple" style="font-size:16px">'+fmt(totalRevenue)+'</div><div class="l">Tushum</div></div></div>';
h+='<div class="sec"><div class="sech"><div class="sect">🏪 Do\'kon</div></div><div class="secb">';
if(S.shop.logo)h+='<div style="text-align:center;margin-bottom:12px"><img src="'+S.shop.logo+'" style="width:80px;height:80px;border-radius:20px;object-fit:cover"></div>';
h+='<div style="font-size:15px;font-weight:800;margin-bottom:6px">'+esc(S.shop.name)+'</div>';
h+='<div style="font-size:13px;color:var(--tx2);line-height:1.7">📍 '+esc(S.shop.address)+'<br>📞 '+esc(S.shop.phone)+'</div></div></div>';
h+='<div class="sec"><div class="sech"><div class="sect">📋 So\'nggi buyurtmalar</div></div><div class="secb">';
if(!orders.length){h+='<div style="text-align:center;padding:24px;color:var(--tx3);font-size:13px">Buyurtma yo\'q</div>';}
else{orders.slice(0,3).forEach(function(o){h+=orderCard(o,true);});}
h+='</div></div>';
return h;
}
function renderAdd(){
if(S.editId)return renderEdit();
var h='<div class="sec"><div class="sech"><div class="sect"><span class="num">➕</span>Yangi mahsulot</div></div><div class="secb">'+
'<div class="field"><label class="flabel">Rasm 1-5 ta *</label><div class="imgup" onclick="document.getElementById(\'prodImg\').click()"><div class="ic">📷</div><div class="t">Rasm qo\'shish</div></div><input type="file" id="prodImg" accept="image/*" multiple style="display:none" onchange="pickProdImg(event)"><div class="imgprev" id="prodImgPrev"></div></div>'+
'<div class="field"><label class="flabel">Nomi *</label><input class="finput" id="pName" placeholder="Mahsulot nomi" maxlength="80"></div>'+
'<div class="row2"><div class="field"><label class="flabel">Kategoriya *</label><select class="fselect" id="pCat"><option value="">Tanlang...</option>'+CATS.map(function(c){return '<option value="'+c.id+'">'+c.e+' '+esc(c.n)+'</option>';}).join('')+'</select></div>'+
'<div class="field"><label class="flabel">Birlik *</label><select class="fselect" id="pUnit">'+UNITS.map(function(u){return '<option value="'+u+'">'+u+'</option>';}).join('')+'</select></div></div>'+
'<div class="row2"><div class="field"><label class="flabel">Narx *</label><input class="finput" id="pPrice" type="number" placeholder="45000" min="0"></div>'+
'<div class="field"><label class="flabel">Miqdor *</label><input class="finput" id="pStock" type="number" placeholder="100" min="0"></div></div>'+
'<div class="field"><label class="flabel">Eski narx (ixtiyoriy)</label><input class="finput" id="pOldPrice" type="number" placeholder="60000" min="0"></div>'+
'<div class="field"><label class="flabel">Tavsif</label><textarea class="ftextarea" id="pDesc" placeholder="Mahsulot haqida..." maxlength="500"></textarea></div>'+
'<button class="btn bp" id="saveProdBtn" onclick="saveProduct()">💾 Saqlash</button></div></div>';
return h;
}
async function pickProdImg(e){
var files=Array.from(e.target.files||[]);if(!files.length)return;
if(S.imgBuffers.length+files.length>5){toast('Maksimal 5 ta','e');return;}
if(S.uploading){toast('Yuklanmoqda','e');return;}
S.uploading=true;
for(var i=0;i<files.length;i++){
var f=files[i];if(f.size>5*1024*1024){toast('Juda katta','e');continue;}
var tempId='tmp_'+Date.now()+'_'+i;S.imgBuffers.push(tempId);renderProdImgPrev();
try{var res=await DB.uploadImage(f,'products');var idx=S.imgBuffers.indexOf(tempId);if(idx!==-1)S.imgBuffers[idx]=res.url;renderProdImgPrev();}
catch(err){var idx2=S.imgBuffers.indexOf(tempId);if(idx2!==-1)S.imgBuffers.splice(idx2,1);renderProdImgPrev();toast('Xato','e');}
}
S.uploading=false;e.target.value='';toast('✅ '+S.imgBuffers.length+' ta rasm','o');
}
function renderProdImgPrev(){
var el=document.getElementById('prodImgPrev');if(!el)return;
el.innerHTML=S.imgBuffers.map(function(src,i){
var isUp=String(src).indexOf('tmp_')===0;
return '<div class="imgpv">'+(isUp?'<div class="up"><div>⏳</div></div>':'<img src="'+src+'">')+'<button class="rm" onclick="rmProdImg('+i+')">✕</button></div>';
}).join('');
}
function rmProdImg(i){S.imgBuffers.splice(i,1);renderProdImgPrev();}
async function saveProduct(){
if(S.uploading){toast('Yuklanmoqda','e');return;}
var n=(document.getElementById('pName').value||'').trim();
var c=document.getElementById('pCat').value;
var u=document.getElementById('pUnit').value;
var p=parseInt(document.getElementById('pPrice').value);
var s=parseInt(document.getElementById('pStock').value);
var op=parseInt(document.getElementById('pOldPrice').value);
var d=(document.getElementById('pDesc').value||'').trim();
var validImgs=S.imgBuffers.filter(function(x){return String(x).indexOf('tmp_')!==0;});
if(validImgs.length<1)return toast('Kamida 1 ta rasm','e');
if(n.length<2)return toast('Nom kiriting','e');
if(!c)return toast('Kategoriya tanlang','e');
if(!p||p<=0)return toast('Narx kiriting','e');
if(isNaN(s)||s<0)return toast('Miqdor kiriting','e');
var btn=document.getElementById('saveProdBtn');btn.disabled=true;btn.textContent='⏳...';
try{
var catObj=CATS.find(function(x){return x.id===c;});
var products=toArray(DB.get('products',[]));
products.unshift({id:uid('p'),name:n,category:c,emoji:catObj?catObj.e:'📦',unit:u,price:p,oldPrice:op&&op>p?op:null,stock:s,description:d,images:validImgs.slice(),shopId:S.shop.id,shopName:S.shop.name,region:S.shop.address,rt:5.0,rc:0,createdAt:new Date().toISOString()});
await DB.set('products',products);
S.imgBuffers=[];toast('✅ Qo\'shildi!','o');
setTimeout(function(){S.tab='list';render();},500);
}catch(e){btn.disabled=false;btn.textContent='💾 Saqlash';toast('Xato','e');}
}
function renderEdit(){
var p=S.products.find(function(x){return x.id===S.editId;});
if(!p){S.editId=null;return renderAdd();}
if(S.imgBuffers.length===0&&p.images)S.imgBuffers=p.images.slice();
var h='<div class="sec"><div class="sech"><div class="sect">✏️ Tahrirlash</div></div><div class="secb">'+
'<div class="field"><label class="flabel">Rasm</label><div class="imgup" onclick="document.getElementById(\'prodImg\').click()"><div class="ic">📷</div><div class="t">Rasm</div></div><input type="file" id="prodImg" accept="image/*" multiple style="display:none" onchange="pickProdImg(event)"><div class="imgprev" id="prodImgPrev">'+S.imgBuffers.map(function(src,i){var isUp=String(src).indexOf('tmp_')===0;return '<div class="imgpv">'+(isUp?'<div class="up"><div>⏳</div></div>':'<img src="'+src+'">')+'<button class="rm" onclick="rmProdImg('+i+')">✕</button></div>';}).join('')+'</div></div>'+
'<div class="field"><label class="flabel">Nomi</label><input class="finput" id="pName" value="'+esc(p.name)+'" maxlength="80"></div>'+
'<div class="row2"><div class="field"><label class="flabel">Kategoriya</label><select class="fselect" id="pCat">'+CATS.map(function(c){return '<option value="'+c.id+'" '+(p.category===c.id?'selected':'')+'>'+c.e+' '+esc(c.n)+'</option>';}).join('')+'</select></div><div class="field"><label class="flabel">Birlik</label><select class="fselect" id="pUnit">'+UNITS.map(function(u){return '<option value="'+u+'" '+(p.unit===u?'selected':'')+'>'+u+'</option>';}).join('')+'</select></div></div>'+
'<div class="row2"><div class="field"><label class="flabel">Narx</label><input class="finput" id="pPrice" type="number" value="'+p.price+'"></div><div class="field"><label class="flabel">Miqdor</label><input class="finput" id="pStock" type="number" value="'+p.stock+'"></div></div>'+
'<div class="field"><label class="flabel">Eski narx</label><input class="finput" id="pOldPrice" type="number" value="'+(p.oldPrice||'')+'"></div>'+
'<div class="field"><label class="flabel">Tavsif</label><textarea class="ftextarea" id="pDesc" maxlength="500">'+esc(p.description||'')+'</textarea></div>'+
'<button class="btn bp" id="saveProdBtn" onclick="updateProduct()">💾 Saqlash</button>'+
'<button class="btn bg" style="margin-top:8px" onclick="cancelEdit()">← Bekor</button></div></div>';
return h;
}
async function updateProduct(){
if(S.uploading){toast('Yuklanmoqda','e');return;}
var n=(document.getElementById('pName').value||'').trim();
var c=document.getElementById('pCat').value;
var u=document.getElementById('pUnit').value;
var p=parseInt(document.getElementById('pPrice').value);
var s=parseInt(document.getElementById('pStock').value);
var op=parseInt(document.getElementById('pOldPrice').value);
var d=(document.getElementById('pDesc').value||'').trim();
var validImgs=S.imgBuffers.filter(function(x){return String(x).indexOf('tmp_')!==0;});
if(validImgs.length<1)return toast('Rasm kerak','e');
if(!p||p<=0)return toast('Narx kiriting','e');
var btn=document.getElementById('saveProdBtn');btn.disabled=true;btn.textContent='⏳...';
try{
var products=toArray(DB.get('products',[]));
var idx=products.findIndex(function(x){return x.id===S.editId;});
if(idx===-1)throw new Error('Topilmadi');
var catObj=CATS.find(function(x){return x.id===c;});
products[idx].name=n;products[idx].category=c;products[idx].emoji=catObj?catObj.e:products[idx].emoji;
products[idx].unit=u;products[idx].price=p;products[idx].oldPrice=op&&op>p?op:null;
products[idx].stock=s;products[idx].description=d;products[idx].images=validImgs.slice();
products[idx].updatedAt=new Date().toISOString();
await DB.set('products',products);
S.editId=null;S.imgBuffers=[];toast('✅ Saqlandi','o');
setTimeout(function(){S.tab='list';render();},500);
}catch(e){btn.disabled=false;btn.textContent='💾 Saqlash';toast('Xato','e');}
}
function cancelEdit(){S.editId=null;S.imgBuffers=[];render();}
function renderList(){
var h='<div class="sec"><div class="sech"><div class="sect">📦 Mahsulotlar</div><div style="font-size:12px;color:var(--tx3)">'+S.products.length+' ta</div></div><div class="secb">';
if(!S.products.length){h+='<div style="text-align:center;padding:24px;color:var(--tx3);font-size:13px">Mahsulot yo\'q</div>';}
else{S.products.forEach(function(p){
var img=p.images&&p.images[0]?'<img src="'+p.images[0]+'">':(p.emoji||'📦');
h+='<div class="prow"><div class="img">'+img+'</div><div class="info"><div class="n">'+esc(p.name)+'</div><div class="m">'+p.stock+' '+esc(p.unit||'dona')+' · '+(p.rc||0)+' sharh</div><div class="p">'+fmt(p.price)+'</div></div><div class="act"><button class="abtn edit" onclick="editProd(\''+p.id+'\')">✏️</button><button class="abtn del" onclick="delProd(\''+p.id+'\')">🗑</button></div></div>';
});}
h+='</div></div>';
return h;
}
function editProd(id){S.editId=id;S.imgBuffers=[];S.tab='add';render();window.scrollTo({top:0,behavior:'smooth'});}
var _delId=null;
function delProd(id){
_delId=id;
openMd('🗑','O\'chirilsinmi?','Mahsulot o\'chiriladi.','O\'chirish','r',async function(){
var products=toArray(DB.get('products',[])).filter(function(p){return p.id!==_delId;});
try{await DB.set('products',products);toast('🗑 O\'chirildi','o');}catch(e){toast('Xato','e');}
});
}
function renderOrders(){
var orders=myOrders();
orders.sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');});
var h='<div class="sec"><div class="sech"><div class="sect">📋 Buyurtmalar</div><div style="font-size:12px;color:var(--tx3)">'+orders.length+' ta</div></div><div class="secb">';
if(!orders.length){h+='<div style="text-align:center;padding:24px;color:var(--tx3);font-size:13px">Buyurtma yo\'q</div>';}
else{orders.forEach(function(o){h+=orderCard(o,false);});}
h+='</div></div>';
return h;
}
function orderCard(o,compact){
var st=o.status||'yangi';
var stMap={yangi:{l:'🆕 Yangi',c:'new'},tolandi:{l:'✅ To\'landi',c:'acc'},yolda:{l:'🚚 Yo\'lda',c:'way'},yetkazildi:{l:'📦 Yetkazildi',c:'done'},bekor:{l:'❌ Bekor',c:'cancel'}};
var s=stMap[st]||stMap.yangi;
var h='<div class="order '+(st==='yangi'?'new':st==='yetkazildi'?'done':st==='bekor'?'cancel':'')+'">'+
'<div class="order-h"><div><div class="id">#'+esc(o.id)+'</div><div class="date">'+fmtDate(o.createdAt)+'</div></div><div class="badge '+s.c+'">'+s.l+'</div></div>';
var cust=o.customer||{};
h+='<div class="order-cust">👤 <b>'+esc(cust.name||'—')+'</b><br>📞 '+esc(cust.phone||'—')+'<br>📍 '+esc([cust.region,cust.district,cust.address].filter(Boolean).join(', '))+'<br>💳 '+esc(o.paymentName||'—')+'</div>';
var myProdIds=S.products.map(function(p){return String(p.id);});
var myItems=(o.items||[]).filter(function(it){return myProdIds.indexOf(String(it.id))!==-1;});
if(myItems.length){
h+='<div style="margin-bottom:10px">';
myItems.forEach(function(it){var sum=(Number(it.price)||0)*(Number(it.qty)||1);h+='<div class="order-item"><div class="n">'+esc(it.name)+' × '+it.qty+'</div><div class="p">'+fmt(sum)+'</div></div>';});
h+='</div>';
}
var myTotal=myItems.reduce(function(s,it){return s+(Number(it.price)||0)*(Number(it.qty)||1);},0);
h+='<div class="order-total"><span>Mening ulushim:</span><span class="v">'+fmt(myTotal)+'</span></div>';
if(!compact){
if(st==='yangi'){h+='<div class="order-acts"><button class="btn bg bsm" onclick="setStatus(\''+o.id+'\',\'tolandi\')">✅ Qabul</button><button class="btn br bsm" onclick="setStatus(\''+o.id+'\',\'bekor\')">❌ Rad</button></div>';}
else if(st==='tolandi'){h+='<div class="order-acts"><button class="btn ba bsm" onclick="setStatus(\''+o.id+'\',\'yolda\')">🚚 Yo\'lga</button></div>';}
else if(st==='yolda'){h+='<div class="order-acts"><button class="btn bp bsm" onclick="setStatus(\''+o.id+'\',\'yetkazildi\')">📦 Yetkazildi</button></div>';}
}
h+='</div>';
return h;
}
async function setStatus(id,st){
try{
var orders=toArray(DB.get('orders',[]));
var idx=orders.findIndex(function(o){return o.id===id;});
if(idx===-1)return;
orders[idx].status=st;orders[idx].updatedAt=new Date().toISOString();
if(!orders[idx].statusLog)orders[idx].statusLog=[];
orders[idx].statusLog.push({status:st,date:new Date().toISOString(),by:S.shop.name});
await DB.set('orders',orders);
if(window.addNotification){window.addNotification({type:st==='yetkazildi'?'success':st==='bekor'?'danger':'order',icon:st==='yetkazildi'?'📦':st==='bekor'?'❌':st==='yolda'?'🚚':'✅',iconClass:st==='yetkazildi'?'green':st==='bekor'?'red':st==='yolda'?'yellow':'blue',title:'Buyurtma: '+st,text:'#'+id+' · '+S.shop.name,link:'orders.html'});}
var m={tolandi:'✅ Qabul qilindi',yolda:'🚚 Yo\'lga chiqarildi',yetkazildi:'📦 Yetkazildi',bekor:'❌ Rad etildi'};
toast(m[st]||'Yangilandi','o');
}catch(e){toast('Xato','e');}
}
var _cb=null;
function openMd(ico,t,d,okText,okCls,cb){
document.getElementById('mbox').innerHTML='<div class="mico">'+ico+'</div><div class="mt">'+t+'</div><div class="mdd">'+esc(d)+'</div><div class="mbtns"><button class="mbtn g" onclick="closeMd()">Bekor</button><button class="mbtn '+(okCls||'r')+'" onclick="mdConfirm()">'+okText+'</button></div>';
_cb=cb;document.getElementById('md').classList.add('on');
}
function closeMd(){document.getElementById('md').classList.remove('on');_cb=null;}
function mdConfirm(){if(_cb)_cb();closeMd();}
function confirmLogout(){
openMd('🚪','Chiqish','Hisobdan chiqmoqchimisiz?','Chiqish','r',async function(){try{await DB.remove('user');}catch(e){}toast('👋 Chiqdingiz','o');setTimeout(function(){location.href='index.html';},600);});
}
function setupListeners(){
DB.on('shops',function(val){
var shops=toArray(val);
S.shop=shops.find(function(s){return s.ownerId===S.user.userId;})||null;
render();
});
DB.on('products',function(val){
var all=toArray(val).filter(function(p){return p&&p.name;});
if(S.shop){S.products=all.filter(function(p){return p.shopId===S.shop.id;});}else{S.products=[];}
render();
});
DB.on('orders',function(val){S.orders=toArray(val).filter(function(o){return o&&o.id;});render();});
}
function init(){
var th=DB.get('theme','dark');
document.body.dataset.t=th;
S.user=DB.get('user',{});
if(DB.isReady())onReady();
else{
window.addEventListener('db:ready',onReady);
setTimeout(function(){updateDbStatus('offline','💾 Offline rejim');},3000);
}
window.addEventListener('db:connection',function(e){updateDbStatus(e.detail.online?'online':'offline',e.detail.online?'🟢 Online':'🔴 Offline');});
}
function onReady(){
console.log('🔥 Firebase tayyor');
updateDbStatus('online','🟢 Online — real-time');
DB.syncAll().then(function(){
S.user=DB.get('user',{});
var shops=toArray(DB.get('shops',[]));
S.shop=shops.find(function(s){return s.ownerId===S.user.userId;})||null;
var products=toArray(DB.get('products',[])).filter(function(p){return p&&p.name;});
if(S.shop){S.products=products.filter(function(p){return p.shopId===S.shop.id;});}
S.orders=toArray(DB.get('orders',[])).filter(function(o){return o&&o.id;});
setupListeners();
render();
});
}
init();
console.log('✅ Seller sahifasi — Firebase bilan');
</script>
