<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0B1119">
<title>Xizmat ko'rsatuvchi — RAYIS BOZORI</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>
<style>
:root{--bg:#0B1119;--surf:#151C26;--surf2:#1E2733;--brd:#2A3441;--tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;--pri:#10B981;--pri2:#34D399;--priS:#064E3B;--acc:#3B82F6;--accS:#1E3A8A;--er:#EF4444;--wn:#F59E0B;--pu:#8B5CF6;--cy:#06B6D4;--cyS:#164E63;--safe-b:env(safe-area-inset-bottom,0px);}
[data-t="light"]{--bg:#F5F7FA;--surf:#FFFFFF;--surf2:#EEF2F7;--brd:#E2E8F0;--tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;--pri:#059669;--pri2:#10B981;--priS:#ECFDF5;--acc:#2563EB;--accS:#EFF6FF;--cy:#06B6D4;--cyS:#CFFAFE;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:100px}
.app{max-width:640px;margin:0 auto;padding:14px}
.hdr{background:linear-gradient(135deg,var(--cy),#0891B2);border-radius:16px;padding:14px;margin-bottom:14px;position:sticky;top:8px;z-index:40;box-shadow:0 4px 20px rgba(6,182,212,.3)}
.htop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand-r{width:38px;height:38px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#0891B2}
.brand-t{font-size:15px;font-weight:800;color:#fff;line-height:1.1}
.brand-t span{color:rgba(255,255,255,.7)}
.brand-s{font-size:10px;color:rgba(255,255,255,.7);letter-spacing:.1em;margin-top:2px}
.hbtn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 12px;border-radius:12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.hinfo{display:flex;align-items:center;gap:10px;color:#fff;font-size:12px}
.hinfo .av{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px}
.hinfo .nm{font-weight:800}
.hinfo .badge{background:#fff;color:#0891B2;font-size:9px;font-weight:900;padding:2px 6px;border-radius:6px}
.db-status{margin:0 4px 14px;padding:8px 12px;border-radius:12px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px}
.db-status.connecting{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#FBBF24}
.db-status.online{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#34D399}
.db-status.offline{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#F87171}
.db-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 16px;background:var(--surf);border:1px solid var(--brd);border-radius:20px;font-size:13px;font-weight:700;color:var(--tx2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:inherit;position:relative}
.tab.on{background:var(--cyS);border-color:var(--cy);color:var(--cy);font-weight:800}
.tab .badge{background:var(--er);color:#fff;font-size:9px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--surf);border:1px solid var(--brd);border-radius:12px;padding:14px}
.kpi .v{font-size:24px;font-weight:900;color:var(--cy);line-height:1}
.kpi .v.green{color:var(--pri2)}
.kpi .v.yellow{color:var(--wn)}
.kpi .v.purple{color:var(--pu)}
.kpi .l{font-size:11px;color:var(--tx2);margin-top:6px;font-weight:700;text-transform:uppercase}
.sec{background:var(--surf);border:1px solid var(--brd);border-radius:16px;margin-bottom:14px;overflow:hidden}
.sech{padding:14px 16px;background:var(--surf2);border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
.sect{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.sect .num{width:22px;height:22px;border-radius:50%;background:var(--cyS);color:var(--cy);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.secb{padding:16px}
.field{margin-bottom:14px}
.flabel{display:block;font-size:13px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.flabel .hint{font-size:11px;color:var(--tx3);font-weight:500}
.finput,.fselect,.ftextarea{width:100%;padding:14px;background:var(--surf2);border:2px solid transparent;border-radius:12px;color:var(--tx);font-size:15px;font-family:inherit;outline:none;transition:.2s;font-weight:500}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--cy);background:var(--surf)}
.ftextarea{resize:vertical;min-height:80px}
.fselect{-webkit-appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='%2394A3B8'><path d='M8 12L2 6h12z'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgup{border:2px dashed var(--brd);border-radius:12px;padding:20px;text-align:center;cursor:pointer;background:var(--surf2)}
.imgup .ic{font-size:32px;margin-bottom:6px}
.imgup .t{font-size:13px;font-weight:800;color:var(--cy)}
.imgprev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.imgpv{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surf2);border:1px solid var(--brd)}
.imgpv img{width:100%;height:100%;object-fit:cover}
.imgpv .rm{position:absolute;top:4px;right:4px;background:var(--er);color:#fff;width:24px;height:24px;border-radius:50%;font-size:12px;border:none;cursor:pointer;font-family:inherit}
.imgpv .up{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-direction:column;gap:4px}
.btn{padding:14px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;border:none;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bp{background:linear-gradient(135deg,var(--cy),#0891B2);color:#fff}
.bg{background:var(--surf2);color:var(--tx);border:1px solid var(--brd)}
.ba{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff}
.br{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff}
.bgr{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff}
.bsm{padding:10px 14px;font-size:12px;width:auto;min-height:auto}
.row{display:flex;gap:12px;padding:12px;background:var(--surf2);border-radius:12px;margin-bottom:8px;align-items:center}
.row .img{width:52px;height:52px;border-radius:12px;background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden}
.row .img img{width:100%;height:100%;object-fit:cover}
.row .info{flex:1;min-width:0}
.row .n{font-size:13px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:11px;color:var(--tx2);margin-bottom:3px}
.row .p{font-size:14px;font-weight:900;color:var(--cy)}
.row .rt{font-size:11px;color:#F59E0B;font-weight:700;margin-top:2px}
.row .act{display:flex;gap:6px}
.row .abtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--brd);background:var(--surf);color:var(--tx);font-size:14px;cursor:pointer;font-family:inherit}
.row .abtn.edit{background:rgba(59,130,246,.15);color:#60A5FA}
.row .abtn.del{background:rgba(239,68,68,.15);color:#F87171}
.order{background:var(--surf2);border-radius:12px;padding:14px;margin-bottom:10px;border-left:3px solid var(--wn)}
.order.new{border-left-color:var(--acc)}
.order.acc{border-left-color:var(--pu)}
.order.work{border-left-color:var(--cy)}
.order.done{border-left-color:var(--pri2);opacity:.85}
.order.cancel{border-left-color:var(--er);opacity:.7}
.order-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.order-h .id{font-size:12px;font-weight:900;color:var(--cy)}
.order-h .date{font-size:10px;color:var(--tx3);margin-top:2px}
.order-h .badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}
.badge.new{background:rgba(59,130,246,.15);color:#60A5FA}
.badge.acc{background:rgba(139,92,246,.15);color:#A78BFA}
.badge.work{background:rgba(6,182,212,.15);color:var(--cy)}
.badge.done{background:rgba(16,185,129,.15);color:#34D399}
.badge.cancel{background:rgba(239,68,68,.15);color:#F87171}
.order-cust{font-size:12px;color:var(--tx2);line-height:1.7;padding:10px;background:var(--surf);border-radius:12px;margin-bottom:10px}
.order-cust b{color:var(--tx);font-weight:700}
.order-desc{font-size:12px;color:var(--tx2);padding:10px;background:var(--surf);border-radius:12px;margin-bottom:10px}
.order-total{display:flex;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--brd);font-size:14px;font-weight:900}
.order-total .v{color:var(--cy);font-size:18px}
.order-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.order-acts .btn{flex:1;min-width:100px;font-size:12px;padding:10px}
.empty{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty .ic{font-size:64px;margin-bottom:14px;opacity:.4}
.empty h3{font-size:16px;font-weight:800;color:var(--tx2);margin-bottom:8px}
.empty button{background:linear-gradient(135deg,var(--cy),#0891B2);color:#fff;border:none;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.open-profile{background:var(--surf);border:1px solid var(--brd);border-radius:16px;padding:24px 20px;text-align:center}
.open-profile .ic{font-size:60px;margin-bottom:12px}
.open-profile .t{font-size:20px;font-weight:900;margin-bottom:6px}
.open-profile .d{font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:20px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--brd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--safe-b));z-index:100;max-width:640px;margin:0 auto}
.nb{background:none;border:none;color:var(--tx3);font-size:10px;font-weight:600;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;font-family:inherit}
.nb.on{color:var(--cy)}
.nb .ic{font-size:22px}
.tst{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:100px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.e{background:var(--er);color:#fff}
.tst.o{background:var(--pri);color:#fff}
.md{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.md.on{display:flex}
.mbox{background:var(--surf);border-radius:16px;padding:24px;max-width:380px;width:100%;text-align:center}
.mico{font-size:48px;margin-bottom:12px}
.mt{font-size:17px;font-weight:800;margin-bottom:6px}
.mdd{font-size:14px;color:var(--tx2);margin-bottom:20px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{padding:14px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;border:none;font-family:inherit}
.mbtn.g{background:var(--surf2);color:var(--tx);border:1px solid var(--brd)}
.mbtn.r{background:var(--er);color:#fff}
</style>
</head>
<body data-t="dark">

<div class="app">
  <div class="hdr">
    <div class="htop">
      <div class="brand">
        <div class="brand-r">R</div>
        <div>
          <div class="brand-t">RAYIS <span>XIZMAT</span></div>
          <div class="brand-s">XIZMAT KO'RSATUVCHI</div>
        </div>
      </div>
      <button class="hbtn" onclick="confirmLogout()">Chiqish</button>

    <div class="hinfo">
      <div class="av">🔧</div>

  <div class="db-status connecting" id="dbStatus">
    <span class="dot"></span><span id="dbText">Firebase ulanmoqda...</span>

  <div id="content"></div>
</div>

<div class="nav">
  <button class="nb" onclick="location.href='home.html'"><span class="ic">🏠</span><span>Bosh</span></button>

  <button class="nb" onclick="location.href='orders.html'"><span class="ic">📋</span><span>Buyurtma</span></button>
  <button class="nb" onclick="location.href='profile.html'"><span class="ic">👤</span><span>Profil</span></button>
</div>

  <div class="mbox" id="mbox"></div>
</div>

<script>
var SVC_CATS=[
  {id:'santexnik',n:'Santexnik',e:'🚰'},{id:'elektrik',n:'Elektrik',e:'⚡'},
  {id:'duradgor',n:'Duradgor',e:'🔨'},{id:'quruvchi',n:'Quruvchi',e:'👷'},
  {id:'suvoqchi',n:'Suvoqchi',e:'🎨'},{id:'tomchi',n:'Tomchi',e:'🏠'},
  {id:'kafelchi',n:'Kafelchi',e:'🧱'},{id:'malyar',n:'Malyar',e:'🖌'},
  {id:'payvandchi',n:'Payvandchi',e:'⚒'},{id:'mebel',n:'Mebel ustasi',e:'🪑'},
  {id:'konditsioner',n:'Konditsioner',e:'❄️'},{id:'kompyuter',n:'Kompyuter',e:'💻'},
  {id:'telefon',n:'Telefon ustasi',e:'📱'},{id:'shifokor',n:'Shifokor',e:'🩺'},
  {id:'oqituvchi',n:"O'qituvchi",e:'📚'},{id:'sartarosh',n:'Sartarosh',e:'✂️'},
  {id:'kosmetolog',n:'Kosmetolog',e:'💆'},{id:'massaj',n:'Massajchi',e:'💆‍♂️'},
  {id:'boshqa',n:'Boshqa',e:'🔧'}
];
var UNITS=['xizmat','kun','soat','loyiha','oy','m²','m³','metr','dona','chaqiruv'];

var S={tab:'dash',user:{},profile:null,allServices:[],orders:[],editId:null,imgBuffers:[],uploading:false};

function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){var e=document.getElementById('tst');e.textContent=m;e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');clearTimeout(e._t);e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':tp==='o'?' o':'');},2400);}
function updateDbStatus(cls,text){var el=document.getElementById('dbStatus');if(!el)return;el.className='db-status '+cls;document.getElementById('dbText').textContent=text;}
function toArray(val){if(!val)return[];if(Array.isArray(val))return val;if(typeof val==='object')return Object.values(val);return[];}
function uid(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function fmtDate(iso){if(!iso)return '—';try{var d=new Date(iso);var pad=function(n){return String(n).padStart(2,'0');};return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}catch(e){return '—';}}

function myServices(){return S.allServices.filter(function(s){return s.masterId===S.user.userId||s.providerId===S.user.userId;});}
function myOrders(){if(!S.user.userId)return[];return S.orders.filter(function(o){return o.masterId===S.user.userId||o.providerId===S.user.userId;});}
function countNewOrders(){return myOrders().filter(function(o){return o.status==='yangi';}).length;}

function render(){
  if(!S.user||!S.user.userId){
    document.getElementById('content').innerHTML='<div class="empty"><div class="ic">🔐</div><h3>Kirish kerak</h3><button onclick="location.href=\'index.html\'">🔐 Kirish</button></div>';
    return;
  }
  document.getElementById('masterName').textContent=S.user.name||'Xizmat ko\'rsatuvchi';
  if(!S.profile){renderOpenProfile();return;}
  var h='';h+=renderTabs();
  if(S.tab==='dash')h+=renderDash();
  else if(S.tab==='add')h+=renderAdd();
  else if(S.tab==='list')h+=renderList();
  else if(S.tab==='orders')h+=renderOrders();
  document.getElementById('content').innerHTML=h;
}

function renderOpenProfile(){
  S.imgBuffers=[];
  var h='<div class="open-profile"><div class="ic">🔧</div><div class="t">Xizmat profilingizni yarating</div><div class="d">Mijozlar sizni topishi uchun<br>o\'z xizmatingizni ro\'yxatdan o\'tkazing</div></div>';
  h+='<div class="sec" style="margin-top:14px"><div class="sech"><div class="sect"><span class="num">1</span>Xizmat ma\'lumotlari</div></div><div class="secb">';
  h+='<div class="field"><label class="flabel">To\'liq ismingiz *</label><input class="finput" id="svcName" value="'+esc(S.user.name||'')+'" maxlength="60"></div>';
  h+='<div class="field"><label class="flabel">Xizmat turi *</label><select class="fselect" id="svcCat"><option value="">Tanlang...</option>'+SVC_CATS.map(function(c){return '<option value="'+c.id+'">'+c.e+' '+esc(c.n)+'</option>';}).join('')+'</select></div>';
  h+='<div class="row2"><div class="field"><label class="flabel">Narx *</label><input class="finput" id="svcPrice" type="number" placeholder="90000"></div><div class="field"><label class="flabel">Birlik *</label><select class="fselect" id="svcUnit">'+UNITS.map(function(u){return '<option value="'+u+'">'+u+'</option>';}).join('')+'</select></div></div>';
  h+='<div class="field"><label class="flabel">Telefon *</label><input class="finput" id="svcPhone" type="tel" value="'+esc(S.user.phone||'')+'"></div>';
  h+='<div class="field"><label class="flabel">Hudud *</label><input class="finput" id="svcRegion" value="'+esc(S.user.region||'')+'"></div>';
  h+='<div class="field"><label class="flabel">Tajriba</label><input class="finput" id="svcExp" placeholder="5 yil"></div>';
  h+='<div class="field"><label class="flabel">Tavsif *</label><textarea class="ftextarea" id="svcDesc" maxlength="500" placeholder="Nima ishlarni bajarasiz..."></textarea></div>';
  h+='<div class="field"><label class="flabel">Rasm 1-5 ta *</label><div class="imgup" onclick="document.getElementById(\'svcImg\').click()"><div class="ic">📷</div><div class="t">Rasm qo\'shish</div></div><input type="file" id="svcImg" accept="image/*" multiple style="display:none" onchange="pickImg(event)"><div class="imgprev" id="svcImgPrev"></div></div>';
  h+='<button class="btn bp" onclick="createProfile()">✅ Ro\'yxatdan o\'tish</button></div></div>';
  document.getElementById('content').innerHTML=h;
}

async function pickImg(e){
  var files=Array.from(e.target.files||[]);
  if(!files.length)return;
  if(S.imgBuffers.length+files.length>5){toast('Maksimal 5 ta','e');return;}
  if(S.uploading){toast('Kuting...','e');return;}
  S.uploading=true;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(f.size>5*1024*1024){toast('"'+f.name+'" juda katta','e');continue;}
    var tempId='tmp_'+Date.now()+'_'+i;
    S.imgBuffers.push(tempId);
    renderImgPrev();
    try{
      var res=await DB.uploadImage(f,'services');
      var idx=S.imgBuffers.indexOf(tempId);
      if(idx!==-1)S.imgBuffers[idx]=res.url;
      renderImgPrev();
    }catch(err){
      var idx2=S.imgBuffers.indexOf(tempId);
      if(idx2!==-1)S.imgBuffers.splice(idx2,1);
      renderImgPrev();
      toast('Xato','e');
    }
  }
  S.uploading=false;
  e.target.value='';
}

function renderImgPrev(){

    var isUp=String(src).indexOf('tmp_')===0;

function rmImg(i){S.imgBuffers.splice(i,1);renderImgPrev();}

async function createProfile(){
  var n=(document.getElementById('svcName').value||'').trim();
  var c=document.getElementById('svcCat').value;
  var p=parseInt(document.getElementById('svcPrice').value);
  var u=document.getElementById('svcUnit').value;
  var ph=(document.getElementById('svcPhone').value||'').trim();
  var rg=(document.getElementById('svcRegion').value||'').trim();
  var ex=(document.getElementById('svcExp').value||'').trim();
  var d=(document.getElementById('svcDesc').value||'').trim();
  var validImgs=S.imgBuffers.filter(function(x){return String(x).indexOf('tmp_')!==0;});
  if(n.length<2)return toast('Ism kiriting','e');
  if(!c)return toast('Turni tanlang','e');
  if(!p||p<=0)return toast('Narx kiriting','e');

function setTab(t){S.tab=t;S.editId=null;S.imgBuffers=[];render();window.scrollTo({top:0,behavior:'smooth'});}

  if(!s){S.editId=null;return renderAdd();}
  if(S.imgBuffers.length===0&&s.images)S.imgBuffers=s.images.slice();
  var h='<div class="sec"><div class="sech"><div class="sect">✏️ Tahrirlash</div></div><div class="secb">';

  h+='<div class="field"><label class="flabel">Xizmat turi</label><select class="fselect" id="svcCat">'+SVC_CATS.map(function(c){return '<option value="'+c.id+'" '+(s.category===c.id?'selected':'')+'>'+c.e+' '+esc(c.n)+'</option>';}).join('')+'</select></div>';

  h+='<button class="btn bg" style="margin-top:8px" onclick="cancelEdit()">← Bekor</button></div></div>';
  return h;
}

async function updateService(){
  var c=document.getElementById('svcCat').value;
  var p=parseInt(document.getElementById('svcPrice').value);
  var u=document.getElementById('svcUnit').value;
  var rg=(document.getElementById('svcRegion').value||'').trim();
  var ex=(document.getElementById('svcExp').value||'').trim();
  var d=(document.getElementById('svcDesc').value||'').trim();
  var validImgs=S.imgBuffers.filter(function(x){return String(x).indexOf('tmp_')!==0;});
  if(validImgs.length<1)return toast('Rasm kerak','e');
  if(!p||p<=0)return toast('Narx kiriting','e');
  try{
    var services=toArray(DB.get('services',[]));
    var idx=services.findIndex(function(x){return x.id===S.editId;});
    if(idx===-1)return;
    var catObj=SVC_CATS.find(function(x){return x.id===c;});
    services[idx].category=c;
    services[idx].spec=catObj.n;
    services[idx].emoji=catObj.e;
    services[idx].price=p;
    services[idx].unit=u;
    services[idx].region=rg;
    services[idx].experience=ex;
    services[idx].description=d;
    services[idx].images=validImgs.slice();
    services[idx].updatedAt=new Date().toISOString();
    await DB.set('services',services);
    S.editId=null;S.imgBuffers=[];
    toast('✅ Saqlandi','o');
    setTimeout(function(){S.tab='list';render();},500);
  }catch(e){toast('Xato','e');}
}
function cancelEdit(){S.editId=null;S.imgBuffers=[];render();}

function renderList(){
  var services=myServices();
  var h='<div class="sec"><div class="sech"><div class="sect">🔧 Xizmatlarim</div><div style="font-size:12px;color:var(--tx3)">'+services.length+' ta</div></div><div class="secb">';
  if(!services.length)h+='<div style="text-align:center;padding:24px;color:var(--tx3)">Hozircha yo\'q</div>';
  else services.forEach(function(s){
    var img=s.images&&s.images[0]?'<img src="'+s.images[0]+'">':(s.emoji||'🔧');
    h+='<div class="row"><div class="img">'+img+'</div><div class="info"><div class="n">'+esc(s.spec||s.name)+'</div><div class="m">📍 '+esc(s.region||'—')+'</div><div class="p">'+fmt(s.price)+' / '+esc(s.unit)+'</div><div class="rt">⭐ '+(s.rt||5).toFixed(1)+' ('+(s.rc||0)+')</div></div><div class="act"><button class="abtn edit" onclick="editSvc(\''+s.id+'\')">✏️</button><button class="abtn del" onclick="delSvc(\''+s.id+'\')">🗑</button></div></div>';
  });
  h+='</div></div>';
  return h;
}

function editSvc(id){S.editId=id;S.imgBuffers=[];S.tab='add';render();window.scrollTo({top:0,behavior:'smooth'});}

var _delId=null;
function delSvc(id){
  _delId=id;
  openMd('🗑','O\'chirilsinmi?','Xizmat o\'chiriladi.','O\'chirish','r',async function(){
    var services=toArray(DB.get('services',[])).filter(function(s){return s.id!==_delId;});
    try{await DB.set('services',services);toast('🗑 O\'chirildi','o');}catch(e){}
  });
}

function renderOrders(){
  var orders=myOrders();
  orders.sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');});
  var h='<div class="sec"><div class="sech"><div class="sect">📋 Buyurtmalar</div><div style="font-size:12px;color:var(--tx3)">'+orders.length+' ta</div></div><div class="secb">';
  if(!orders.length)h+='<div style="text-align:center;padding:24px;color:var(--tx3)">Hozircha yo\'q</div>';
  else orders.forEach(function(o){h+=orderCard(o,false);});
  h+='</div></div>';
  return h;
}

function orderCard(o,compact){
  var st=o.status||'yangi';
  var stMap={yangi:{l:'🆕 Yangi',c:'new'},qabul:{l:'✅ Qabul',c:'acc'},bajarilmoqda:{l:'🔨 Bajarilmoqda',c:'work'},bajarildi:{l:'✓ Bajarildi',c:'done'},bekor:{l:'❌ Bekor',c:'cancel'}};
  var s=stMap[st]||stMap.yangi;
  var cust=o.customer||{};
  var h='<div class="order '+(st==='yangi'?'new':st==='qabul'?'acc':st==='bajarilmoqda'?'work':st==='bajarildi'?'done':st==='bekor'?'cancel':'')+'">';
  h+='<div class="order-h"><div><div class="id">#'+esc(o.id)+'</div><div class="date">'+fmtDate(o.createdAt)+'</div></div><div class="badge '+s.c+'">'+s.l+'</div></div>';
  h+='<div class="order-cust">👤 <b>'+esc(cust.name||'—')+'</b><br>📞 '+esc(cust.phone||'—')+'<br>📍 '+esc(cust.address||'—')+'</div>';
  if(o.description)h+='<div class="order-desc">'+esc(o.description)+'</div>';
  h+='<div class="order-total"><span>Summa:</span><span class="v">'+fmt(o.total||o.price||0)+'</span></div>';
  if(!compact){
    if(st==='yangi')h+='<div class="order-acts"><button class="btn bgr bsm" onclick="setStatus(\''+o.id+'\',\'qabul\')">✅ Qabul</button><button class="btn br bsm" onclick="setStatus(\''+o.id+'\',\'bekor\')">❌ Rad</button></div>';
    else if(st==='qabul')h+='<div class="order-acts"><button class="btn ba bsm" onclick="setStatus(\''+o.id+'\',\'bajarilmoqda\')">🔨 Boshlash</button></div>';
    else if(st==='bajarilmoqda')h+='<div class="order-acts"><button class="btn bgr bsm" onclick="setStatus(\''+o.id+'\',\'bajarildi\')">✓ Bajarildi</button></div>';
  }
  h+='</div>';
  return h;
}

async function setStatus(id,st){
  try{
    var orders=toArray(DB.get('orders',[]));
    var idx=orders.findIndex(function(o){return o.id===id;});
    if(idx===-1)return;
    orders[idx].status=st;
    orders[idx].updatedAt=new Date().toISOString();
    await DB.set('orders',orders);
    var m={qabul:'✅ Qabul',bajarilmoqda:'🔨 Boshlandi',bajarildi:'✓ Bajarildi',bekor:'❌ Rad'};
    toast(m[st]||'Yangilandi','o');
  }catch(e){toast('Xato','e');}
}

var _cb=null;
function openMd(ico,t,d,okText,okCls,cb){
  document.getElementById('mbox').innerHTML='<div class="mico">'+ico+'</div><div class="mt">'+t+'</div><div class="mdd">'+esc(d)+'</div><div class="mbtns"><button class="mbtn g" onclick="closeMd()">Bekor</button><button class="mbtn '+(okCls||'r')+'" onclick="mdConfirm()">'+okText+'</button></div>';
  _cb=cb;
  document.getElementById('md').classList.add('on');
}
function closeMd(){document.getElementById('md').classList.remove('on');_cb=null;}
function mdConfirm(){if(_cb)_cb();closeMd();}

function confirmLogout(){
  openMd('🚪','Chiqish','Hisobdan chiqmoqchimisiz?','Chiqish','r',async function(){
    try{await DB.remove('user');}catch(e){}
    toast('👋 Chiqdingiz','o');
    setTimeout(function(){location.href='index.html';},600);
  });
}

function setupListeners(){
  DB.on('services',function(val){
    S.allServices=toArray(val).filter(function(s){return s&&s.name;});
    var mine=myServices();
    if(mine.length&&!S.profile)S.profile=mine[0];
    render();
  });
  DB.on('orders',function(val){
    S.orders=toArray(val).filter(function(o){return o&&o.id;});
    render();
  });
}

function init(){
  var th=DB.get('theme','dark');
  document.body.dataset.t=th;
  S.user=DB.get('user',{});
  S.allServices=toArray(DB.get('services',[]));
  S.orders=toArray(DB.get('orders',[]));
  var mine=myServices();
  if(mine.length)S.profile=mine[0];
  render();
  if(DB.isReady())onReady();
  else{window.addEventListener('db:ready',onReady);setTimeout(function(){updateDbStatus('offline','💾 Offline');},3000);}
  window.addEventListener('db:connection',function(e){updateDbStatus(e.detail.online?'online':'offline',e.detail.online?'🟢 Online':'🔴 Offline');});
}

function onReady(){
  updateDbStatus('online','🟢 Online');
  DB.syncAll().then(function(){
    S.user=DB.get('user',{});
    S.allServices=toArray(DB.get('services',[])).filter(function(s){return s&&s.name;});
    S.orders=toArray(DB.get('orders',[])).filter(function(o){return o&&o.id;});
    var mine=myServices();
    if(mine.length)S.profile=mine[0];
    setupListeners();
    render();
  });
}

init();
console.log('✅ Xizmat sahifasi — Firebase bilan');
</script>
