<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0B1119">
<title>Chat — RAYIS BOZORI</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>
<style>
:root{--bg:#0B1119;--surf:#151C26;--surf2:#1E2733;--brd:#2A3441;--tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;--pri:#10B981;--pri2:#34D399;--priS:#064E3B;--acc:#3B82F6;--accS:#1E3A8A;--er:#EF4444;--wn:#F59E0B;--pu:#8B5CF6;--r1:8px;--r2:12px;--r3:16px;--r4:24px;--safe-b:env(safe-area-inset-bottom,0px)}
[data-t="light"]{--bg:#F5F7FA;--surf:#FFFFFF;--surf2:#EEF2F7;--brd:#E2E8F0;--tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;--pri:#059669;--pri2:#10B981;--priS:#ECFDF5;--acc:#2563EB;--accS:#EFF6FF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none;height:100%;overflow:hidden}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;transition:background .3s,color .3s}
.hdr{background:var(--surf);border-bottom:1px solid var(--brd);padding:12px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10}
.back{width:42px;height:42px;border-radius:var(--r2);background:var(--surf2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--tx);flex-shrink:0}
.hinfo{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.hav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pri2),var(--pri));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;flex-shrink:0;position:relative;overflow:hidden}
.hav img{width:100%;height:100%;object-fit:cover}
.hav .status-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:var(--tx3);border:2px solid var(--surf);display:block}
.hav .status-dot.online{background:var(--pri2)}
.htext{flex:1;min-width:0}
.hname{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.hstatus{font-size:11px;color:var(--tx2);margin-top:2px;font-weight:600}
.hstatus.online{color:var(--pri2)}
.hstatus.typing{color:var(--acc);font-style:italic}
.hbtn{width:42px;height:42px;border-radius:var(--r2);background:var(--surf2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--tx);flex-shrink:0}
.db-mini{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;display:flex;align-items:center;gap:4px;z-index:20}
.db-mini .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.db-mini.online{background:rgba(16,185,129,.15);color:#34D399}
.db-mini.offline{background:rgba(239,68,68,.15);color:#F87171}
.db-mini.connecting{background:rgba(245,158,11,.15);color:#FBBF24}
.search-wrap{padding:8px 14px;background:var(--surf);border-bottom:1px solid var(--brd);flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;background:var(--surf2);border:2px solid transparent;border-radius:var(--r2);padding:10px 14px}
.search:focus-within{border-color:var(--pri2)}
.search input{flex:1;background:none;border:none;color:var(--tx);font-size:14px;outline:none;font-family:inherit}
.search input::placeholder{color:var(--tx3)}
.chats{flex:1;overflow-y:auto;padding:8px 0}
.chat{display:flex;gap:12px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--brd)}
.chat:active{background:var(--surf2)}
.chat.unread{background:linear-gradient(90deg,rgba(16,185,129,.06),transparent)}
.chat-av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--pri2),var(--pri));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0;position:relative;overflow:hidden}
.chat-av img{width:100%;height:100%;object-fit:cover}
.chat-av .badge-online{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--pri2);border:2px solid var(--bg)}
.chat-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.chat-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.chat-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-time{font-size:11px;color:var(--tx3);flex-shrink:0;font-weight:600}
.chat-time.unread-time{color:var(--pri2)}
.chat-last{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;display:flex;align-items:center;gap:4px}
.chat-last.typing{color:var(--acc);font-style:italic}
.chat-last.me{color:var(--tx3)}
.chat-badge{background:var(--pri2);color:#fff;font-size:10px;font-weight:900;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px;margin-left:auto;flex-shrink:0}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.msg-day{align-self:center;font-size:11px;color:var(--tx3);font-weight:700;padding:6px 12px;background:var(--surf2);border-radius:20px;margin:8px 0}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.4;word-break:break-word;position:relative}
.msg.me{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;align-self:flex-end;border-bottom-right-radius:4px;box-shadow:0 2px 8px rgba(16,185,129,.25)}
.msg.other{background:var(--surf);color:var(--tx);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--brd)}
.msg-text{white-space:pre-wrap}
.msg-img{max-width:220px;border-radius:12px;margin-top:6px;display:block;cursor:pointer}
.msg-time{font-size:10px;opacity:.75;margin-top:4px;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.msg.me .msg-time{color:rgba(255,255,255,.85)}
.msg.other .msg-time{color:var(--tx3)}
.msg-status{font-size:11px}
.msg-status.read{color:var(--acc)}
.msg.me .msg-status.read{color:#fff}
.quick{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;background:var(--surf);border-top:1px solid var(--brd);scrollbar-width:none;flex-shrink:0}
.quick::-webkit-scrollbar{display:none}
.qchip{flex:0 0 auto;padding:8px 14px;background:var(--surf2);border:1px solid var(--brd);border-radius:20px;font-size:12.5px;font-weight:700;color:var(--tx2);cursor:pointer;white-space:nowrap;font-family:inherit}
.qchip:active{background:var(--priS);border-color:var(--pri2);color:var(--pri2)}
.input-wrap{background:var(--surf);border-top:1px solid var(--brd);padding:10px 12px calc(10px + var(--safe-b));display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.input-box{flex:1;background:var(--surf2);border:2px solid transparent;border-radius:22px;padding:10px 16px;min-height:44px;max-height:120px;display:flex;align-items:center}
.input-box:focus-within{border-color:var(--pri2)}
.input-box textarea{flex:1;background:none;border:none;color:var(--tx);font-size:15px;font-family:inherit;outline:none;resize:none;max-height:100px;line-height:1.4;padding:2px 0}
.input-box textarea::placeholder{color:var(--tx3)}
.ibtn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-family:inherit}
.ibtn:active{transform:scale(.9)}
.ibtn.attach{background:var(--surf2);border:1px solid var(--brd);color:var(--tx2)}
.ibtn.send{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.3)}
.ibtn.send:disabled{opacity:.4;cursor:not-allowed}
.img-prev{display:none;padding:8px 12px;background:var(--surf);border-top:1px solid var(--brd);gap:8px;overflow-x:auto;flex-shrink:0}
.img-prev.show{display:flex}
.ipv{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--surf2);flex-shrink:0}
.ipv img{width:100%;height:100%;object-fit:cover}
.ipv .up{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-direction:column;gap:2px}
.ipv .rm{position:absolute;top:2px;right:2px;background:var(--er);color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:900}
.empty{text-align:center;padding:80px 20px;color:var(--tx3)}
.empty .ic{font-size:80px;margin-bottom:16px;opacity:.4}
.empty h3{font-size:17px;font-weight:800;color:var(--tx2);margin-bottom:8px}
.empty p{font-size:13px;line-height:1.6;margin-bottom:20px}
.empty button{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border:none;padding:13px 26px;border-radius:var(--r2);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.imd{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.imd.on{display:flex}
.imd img{max-width:100%;max-height:100%;border-radius:12px}
.tst{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:100px;font-size:13px;font-weight:700;z-index:600;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.e{background:var(--er);color:#fff}
.tst.o{background:var(--pri);color:#fff}
.orders-pick{background:var(--surf);border-top:1px solid var(--brd);padding:10px 14px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.orders-pick::-webkit-scrollbar{display:none}
.opick{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surf2);border:2px solid var(--brd);border-radius:20px;margin-right:8px;font-size:12px;font-weight:700;color:var(--tx2);white-space:nowrap}
.opick.on{background:var(--priS);border-color:var(--pri2);color:var(--pri2)}
.sk{background:linear-gradient(90deg,var(--surf) 25%,var(--surf2) 50%,var(--surf) 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:var(--r2);height:76px;margin:8px 14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body data-t="dark">
<div id="listView" style="display:flex;flex-direction:column;height:100%;position:relative">
<div class="db-mini connecting" id="dbMiniList"><span class="dot"></span><span id="dbTextList">...</span></div>
<div class="hdr">
<button class="back" onclick="goBack()">←</button>
<div class="hinfo">
<div class="htext">
<div class="hname" style="font-size:18px">💬 Chatlar</div>
<div class="hstatus" id="totalUnread">Yuklanmoqda...</div>
</div>
</div>
<button class="hbtn" onclick="markAllRead()">✓✓</button>
</div>
<div class="search-wrap">
<div class="search">
<span>🔍</span>
<input type="text" id="searchInput" placeholder="Chatlarni qidirish..." oninput="filterChats(this.value)">
</div>
</div>
<div class="chats" id="chatList"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</div>
<div id="roomView" style="display:none;flex-direction:column;height:100%">
<div class="db-mini connecting" id="dbMiniRoom"><span class="dot"></span><span id="dbTextRoom">...</span></div>
<div class="hdr">
<button class="back" onclick="closeRoom()">←</button>
<div class="hinfo">
<div class="hav" id="roomAvatar">👤<span class="status-dot"></span></div>
<div class="htext">
<div class="hname" id="roomName">—</div>
<div class="hstatus" id="roomStatus">Online</div>
</div>
</div>
<button class="hbtn" onclick="callUser()">📞</button>
</div>
<div class="orders-pick" id="ordersPick" style="display:none"></div>
<div class="msgs" id="msgs"></div>
<div class="img-prev" id="imgPrev"></div>
<div class="quick" id="quickReplies">
<div class="qchip" onclick="quickReply('Salom! 👋')">Salom 👋</div>
<div class="qchip" onclick="quickReply('Mahsulot bormi?')">Bormi?</div>
<div class="qchip" onclick="quickReply('Narxi qancha?')">Narxi?</div>
<div class="qchip" onclick="quickReply('Manzil qayerda?')">Manzil?</div>
<div class="qchip" onclick="quickReply('Rahmat! 🙏')">Rahmat 🙏</div>
<div class="qchip" onclick="quickReply('Xayr! 👋')">Xayr 👋</div>
</div>
<div class="input-wrap">
<button class="ibtn attach" onclick="document.getElementById('fileInp').click()">📎</button>
<input type="file" id="fileInp" accept="image/*" multiple style="display:none" onchange="pickImg(event)">
<div class="input-box"><textarea id="msgInput" placeholder="Xabar yozing..." rows="1" oninput="onInput(this)" onkeydown="onKey(event)"></textarea></div>
<button class="ibtn send" id="sendBtn" onclick="sendMsg()" disabled>➤</button>
</div>
</div>
<div class="imd" id="imd" onclick="closeImg()"><img id="imdImg" src=""></div>
<div class="tst" id="tst"></div>
<script>
var S={user:null,chats:[],activeChatId:null,pendingImages:[],searchQ:'',typingTimer:null,unsubChats:null};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){var e=document.getElementById('tst');e.textContent=m;e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');clearTimeout(e._t);e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':tp==='o'?' o':'');},2400);}
function goBack(){if(history.length>1)history.back();else location.href='home.html';}
function openImg(src){document.getElementById('imdImg').src=src;document.getElementById('imd').classList.add('on');}
function closeImg(){document.getElementById('imd').classList.remove('on');}
function toArray(val){if(!val)return[];if(Array.isArray(val))return val;if(typeof val==='object')return Object.values(val);return[];}
function uid(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function updateDbStatusView(view,cls,text){var el=view==='list'?document.getElementById('dbMiniList'):document.getElementById('dbMiniRoom');var t=view==='list'?document.getElementById('dbTextList'):document.getElementById('dbTextRoom');if(el)el.className='db-mini '+cls;if(t)t.textContent=text;}
function fmtTime(iso){if(!iso)return '';try{var d=new Date(iso);var now=new Date();var pad=function(n){return String(n).padStart(2,'0');};if(d.toDateString()===now.toDateString())return pad(d.getHours())+':'+pad(d.getMinutes());var diff=Math.floor((now-d)/86400000);if(diff===1)return 'Kecha';if(diff<7)return ['Yak','Du','Se','Chor','Pay','Jum','Shan'][d.getDay()];return pad(d.getDate())+'.'+pad(d.getMonth()+1);}catch(e){return '';}}
function fmtFullTime(iso){if(!iso)return '';try{var d=new Date(iso);var pad=function(n){return String(n).padStart(2,'0');};return pad(d.getHours())+':'+pad(d.getMinutes());}catch(e){return '';}}
function fmtDayLabel(iso){if(!iso)return '';try{var d=new Date(iso);var now=new Date();var pad=function(n){return String(n).padStart(2,'0');};if(d.toDateString()===now.toDateString())return 'Bugun';var y=new Date(now);y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return 'Kecha';return pad(d.getDate())+' '+['Yan','Fev','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'][d.getMonth()]+' '+d.getFullYear();}catch(e){return '';}}
function init(){
var th=DB.get('theme','dark');document.body.dataset.t=th;
S.user=DB.get('user',{});
if(!S.user||!S.user.userId){document.getElementById('chatList').innerHTML='<div class="empty"><div class="ic">🔐</div><h3>Kirish kerak</h3><p>Chatdan foydalanish uchun tizimga kiring</p><button onclick="location.href=\'index.html\'">🔐 Kirish</button></div>';return;}
var params=new URLSearchParams(location.search);
var chatId=params.get('id');var newTo=params.get('new');var newName=params.get('nname');var newProductId=params.get('p');var newProductName=params.get('pn');
if(DB.isReady())onReady(chatId,newTo,newName,newProductId,newProductName);
else{window.addEventListener('db:ready',function(){onReady(chatId,newTo,newName,newProductId,newProductName);});setTimeout(function(){if(!DB.isReady())updateDbStatusView('list','offline','Offline');},3000);}
window.addEventListener('db:connection',function(e){var cls=e.detail.online?'online':'offline';var txt=e.detail.online?'Online':'Offline';updateDbStatusView('list',cls,txt);updateDbStatusView('room',cls,txt);});
}
function onReady(chatId,newTo,newName,newProductId,newProductName){
console.log('🔥 Firebase tayyor');
updateDbStatusView('list','online','Online');
DB.syncAll().then(function(){
loadChats();
if(newTo){createChat(newTo,newName,newProductId,newProductName);return;}
if(chatId){setTimeout(function(){openRoom(chatId);},200);}
});
}
function loadChats(){
if(S.unsubChats)S.unsubChats();
S.unsubChats=DB.on('chats',function(val){
var all=toArray(val);
S.chats=all.filter(function(c){if(!c||!c.participants)return false;return c.participants.some(function(p){return p.userId===S.user.userId;});});
S.chats.sort(function(a,b){return (b.lastUpdate||'').localeCompare(a.lastUpdate||'');});
renderChatList();
if(S.activeChatId)renderRoom();
});
}
function renderChatList(){
var list=document.getElementById('chatList');
if(!S.chats.length){list.innerHTML='<div class="empty"><div class="ic">💬</div><h3>Chatlar yo\'q</h3><p>Mahsulot sahifasidan "💬 Bog\'lanish" tugmasini bosing</p><button onclick="location.href=\'search.html\'">🔍 Mahsulot qidirish</button></div>';document.getElementById('totalUnread').textContent='Xabar yo\'q';return;}
var filtered=S.chats;
if(S.searchQ){var q=S.searchQ.toLowerCase();filtered=S.chats.filter(function(c){var other=getOtherParticipant(c);return other.name.toLowerCase().indexOf(q)!==-1;});}
if(!filtered.length){list.innerHTML='<div class="empty"><div class="ic">🔍</div><p>Hech narsa topilmadi</p></div>';return;}
var totalUnread=0;var h='';
filtered.forEach(function(c){
var other=getOtherParticipant(c);
var unread=countUnread(c);totalUnread+=unread;
var last=lastMessage(c);
var avContent=other.avatar?'<img src="'+other.avatar+'">':'<span>'+esc(other.initial)+'</span>';
h+='<div class="chat '+(unread>0?'unread':'')+'" onclick="openRoom(\''+c.id+'\')"><div class="chat-av">'+avContent+(other.online?'<span class="badge-online"></span>':'')+'</div><div class="chat-body"><div class="chat-top"><div class="chat-name">'+esc(other.name)+'</div>'+(last?'<div class="chat-time '+(unread>0?'unread-time':'')+'">'+fmtTime(last.createdAt)+'</div>':'')+'</div><div class="chat-last '+(last&&last.senderId===S.user.userId?'me':'')+'">'+(other.typing?'✍️ Yozmoqda...':(last?(last.senderId===S.user.userId?'Siz: ':'')+(last.image?'📷 Rasm':esc(last.text||'').substring(0,60))+(unread>0?'<div class="chat-badge">'+unread+'</div>':''):'Xabar yo\'q'))+'</div></div></div>';
});
list.innerHTML=h;
document.getElementById('totalUnread').textContent=totalUnread>0?(totalUnread+' ta yangi xabar'):'Barchasi o\'qilgan';
}
function getOtherParticipant(chat){var other=(chat.participants||[]).find(function(p){return p.userId!==S.user.userId;});if(!other)return{name:'Foydalanuvchi',initial:'?',userId:'',online:false,typing:false};return{userId:other.userId,name:other.name||'Foydalanuvchi',avatar:other.avatar||null,initial:(other.name||'?').charAt(0).toUpperCase(),online:other.online||false,typing:other.typing||false};}
function countUnread(chat){return (chat.messages||[]).filter(function(m){return m.senderId!==S.user.userId&&!m.read;}).length;}
function lastMessage(chat){var msgs=chat.messages||[];return msgs.length?msgs[msgs.length-1]:null;}
function filterChats(q){S.searchQ=q;renderChatList();}
async function markAllRead(){try{var all=toArray(DB.get('chats',[]));var changed=false;all.forEach(function(c){if(!c.participants)return;if(!c.participants.some(function(p){return p.userId===S.user.userId;}))return;(c.messages||[]).forEach(function(m){if(m.senderId!==S.user.userId&&!m.read){m.read=true;changed=true;}});});if(changed)await DB.set('chats',all);toast('✅ Hammasi o\'qilgan','o');}catch(e){toast('Xato','e');}}
async function createChat(otherUserId,otherName,productId,productName){
if(otherUserId===S.user.userId){toast('O\'zingizga yozolmaysiz','e');return;}
var all=toArray(DB.get('chats',[]));
var existing=all.find(function(c){if(!c.participants)return false;var hasMe=c.participants.some(function(p){return p.userId===S.user.userId;});var hasOther=c.participants.some(function(p){return p.userId===otherUserId;});return hasMe&&hasOther;});
if(existing){openRoom(existing.id);return;}
var newChat={id:uid('chat'),participants:[{userId:S.user.userId,name:S.user.name||'Siz',avatar:S.user.avatar||null},{userId:otherUserId,name:otherName||'Sotuvchi',avatar:null}],productId:productId||null,productName:productName||null,messages:[],lastUpdate:new Date().toISOString(),createdAt:new Date().toISOString()};
all.push(newChat);
try{await DB.set('chats',all);openRoom(newChat.id);}catch(e){toast('Chat yaratilmadi','e');}
}
function openRoom(chatId){S.activeChatId=chatId;document.getElementById('listView').style.display='none';document.getElementById('roomView').style.display='flex';markChatRead(chatId);renderRoom();setTimeout(scrollToBottom,100);updateDbStatusView('room',DB.isOnline()?'online':'offline',DB.isOnline()?'Online':'Offline');}
function closeRoom(){S.activeChatId=null;S.pendingImages=[];renderImgPrev();document.getElementById('roomView').style.display='none';document.getElementById('listView').style.display='flex';renderChatList();}
function renderRoom(){
if(!S.activeChatId)return;
var chat=S.chats.find(function(c){return c.id===S.activeChatId;});
if(!chat){closeRoom();return;}
var other=getOtherParticipant(chat);
document.getElementById('roomName').textContent=other.name;
var statusEl=document.getElementById('roomStatus');
if(other.typing){statusEl.textContent='✍️ Yozmoqda...';statusEl.className='hstatus typing';}
else if(other.online){statusEl.textContent='🟢 Online';statusEl.className='hstatus online';}
else{statusEl.textContent='Oxirgi faollik: yaqinda';statusEl.className='hstatus';}
var av=document.getElementById('roomAvatar');
av.innerHTML=other.avatar?'<img src="'+other.avatar+'">':esc(other.initial);
av.innerHTML+='<span class="status-dot '+(other.online?'online':'')+'"></span>';
if(chat.productName){document.getElementById('ordersPick').style.display='block';document.getElementById('ordersPick').innerHTML='<div class="opick on">📦 '+esc(chat.productName)+'</div>';}
else{document.getElementById('ordersPick').style.display='none';}
renderMessages(chat);
}
function renderMessages(chat){
var container=document.getElementById('msgs');
var msgs=chat.messages||[];
if(!msgs.length){container.innerHTML='<div class="empty" style="padding:40px 20px"><div class="ic" style="font-size:60px">💬</div><h3>Xabar yo\'q</h3><p>Suhbatni boshlang</p></div>';return;}
var h='';var lastDay='';
msgs.forEach(function(m){
var day=fmtDayLabel(m.createdAt);
if(day!==lastDay){h+='<div class="msg-day">'+day+'</div>';lastDay=day;}
var cls=m.senderId===S.user.userId?'me':'other';
var statusIcon='';
if(cls==='me'){statusIcon=m.read?'<span class="msg-status read">✓✓</span>':'<span class="msg-status">✓</span>';}
h+='<div class="msg '+cls+'">';
if(m.text)h+='<div class="msg-text">'+esc(m.text)+'</div>';
if(m.image)h+='<img class="msg-img" src="'+m.image+'" onclick="openImg(\''+m.image+'\')">';
h+='<div class="msg-time">'+fmtFullTime(m.createdAt)+' '+statusIcon+'</div></div>';
});
container.innerHTML=h;
scrollToBottom();
}
function scrollToBottom(){var m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;}
function onInput(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';var hasText=el.value.trim().length>0;var hasImages=S.pendingImages.length>0;document.getElementById('sendBtn').disabled=!(hasText||hasImages);if(el.value.trim().length>0)sendTyping();}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function quickReply(text){var inp=document.getElementById('msgInput');inp.value=text;onInput(inp);inp.focus();}
async function sendMsg(){
var inp=document.getElementById('msgInput');var text=inp.value.trim();if(!text&&!S.pendingImages.length)return;
var all=toArray(DB.get('chats',[]));
var idx=all.findIndex(function(c){return c.id===S.activeChatId;});
if(idx===-1)return;
var now=new Date().toISOString();
var images=S.pendingImages.filter(function(x){return String(x).indexOf('tmp_')!==0;});
if(!all[idx].messages)all[idx].messages=[];
if(images.length>0){images.forEach(function(img,i){all[idx].messages.push({id:uid('msg'),senderId:S.user.userId,senderName:S.user.name||'Siz',text:i===0?text:'',image:img,createdAt:now,read:false});});}
else{all[idx].messages.push({id:uid('msg'),senderId:S.user.userId,senderName:S.user.name||'Siz',text:text,image:null,createdAt:now,read:false});}
all[idx].lastUpdate=now;
var me=all[idx].participants.find(function(p){return p.userId===S.user.userId;});if(me)me.typing=false;
try{await DB.set('chats',all);inp.value='';inp.style.height='auto';S.pendingImages=[];renderImgPrev();document.getElementById('sendBtn').disabled=true;}catch(e){toast('Xabar yuborilmadi','e');}
}
async function sendTyping(){
if(S.typingTimer)return;
S.typingTimer=setTimeout(function(){S.typingTimer=null;},2000);
try{var all=toArray(DB.get('chats',[]));var idx=all.findIndex(function(c){return c.id===S.activeChatId;});if(idx===-1)return;var me=all[idx].participants.find(function(p){return p.userId===S.user.userId;});if(me)me.typing=true;await DB.set('chats',all);
setTimeout(async function(){try{var all2=toArray(DB.get('chats',[]));var idx2=all2.findIndex(function(c){return c.id===S.activeChatId;});if(idx2===-1)return;var me2=all2[idx2].participants.find(function(p){return p.userId===S.user.userId;});if(me2)me2.typing=false;await DB.set('chats',all2);}catch(e){}},2500);
}catch(e){}
}
async function pickImg(e){
var files=Array.from(e.target.files||[]);if(!files.length)return;
if(S.pendingImages.length+files.length>4){toast('Maksimal 4 ta','e');return;}
for(var i=0;i<files.length;i++){
var f=files[i];if(f.size>5*1024*1024){toast('Katta','e');continue;}
var tempId='tmp_'+Date.now()+'_'+i;S.pendingImages.push(tempId);renderImgPrev();onInput(document.getElementById('msgInput'));
try{var res=await DB.uploadImage(f,'chats');var idx=S.pendingImages.indexOf(tempId);if(idx!==-1)S.pendingImages[idx]=res.url;renderImgPrev();onInput(document.getElementById('msgInput'));}
catch(err){var idx2=S.pendingImages.indexOf(tempId);if(idx2!==-1)S.pendingImages.splice(idx2,1);renderImgPrev();toast('Xato','e');}
}
e.target.value='';
}
function renderImgPrev(){
var el=document.getElementById('imgPrev');
if(!S.pendingImages.length){el.classList.remove('show');el.innerHTML='';return;}
el.classList.add('show');
el.innerHTML=S.pendingImages.map(function(src,i){var isUp=String(src).indexOf('tmp_')===0;return '<div class="ipv">'+(isUp?'<div class="up"><div>⏳</div></div>':'<img src="'+src+'">')+'<button class="rm" onclick="rmImg('+i+')">✕</button></div>';}).join('');
}
function rmImg(i){S.pendingImages.splice(i,1);renderImgPrev();onInput(document.getElementById('msgInput'));}
async function markChatRead(chatId){try{var all=toArray(DB.get('chats',[]));var idx=all.findIndex(function(c){return c.id===chatId;});if(idx===-1)return;var changed=false;(all[idx].messages||[]).forEach(function(m){if(m.senderId!==S.user.userId&&!m.read){m.read=true;changed=true;}});if(changed)await DB.set('chats',all);}catch(e){}}
function callUser(){if(!S.activeChatId)return;var chat=S.chats.find(function(c){return c.id===S.activeChatId;});if(!chat)return;var phone=chat.otherPhone||null;if(!phone){toast('Telefon mavjud emas','e');return;}if(confirm('Qo\'ng\'iroq qilinsinmi?\n\n'+phone)){location.href='tel:'+phone.replace(/\D/g,'');}}
init();
console.log('✅ Chat sahifasi — Firebase bilan');
</script>
