<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0B1119">
<title>Qidiruv — RAYIS BOZORI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>

<style>
:root{
  --bg:#0B1119;--surf:#151C26;--surf2:#1E2733;--brd:#2A3441;
  --tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;
  --pri:#10B981;--pri2:#34D399;--priS:#064E3B;
  --acc:#3B82F6;--accS:#1E3A8A;
  --er:#EF4444;--wn:#F59E0B;
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-t="light"]{--bg:#F5F7FA;--surf:#FFFFFF;--surf2:#EEF2F7;--brd:#E2E8F0;--tx:#0F172A;--tx2:#475569;--tx3:#94A3B8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:90px}
.app{max-width:640px;margin:0 auto;padding:14px}
.hdr{background:var(--surf);border:1px solid var(--brd);border-radius:16px;padding:12px;margin-bottom:14px;position:sticky;top:8px;z-index:40}
.htop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{width:44px;height:44px;border-radius:12px;background:var(--surf2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--tx);flex-shrink:0}
.htitle{flex:1;font-size:17px;font-weight:800}
.hbtn{width:42px;height:42px;border-radius:12px;background:var(--surf2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:var(--tx);position:relative}
.hbtn .cnt{position:absolute;top:-4px;right:-4px;background:var(--er);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surf)}
.search{display:flex;align-items:center;gap:10px;background:var(--surf2);border:2px solid transparent;border-radius:12px;padding:11px 14px}
.search:focus-within{border-color:var(--pri2)}
.search .ic{font-size:18px;color:var(--pri2)}
.search input{flex:1;background:none;border:none;color:var(--tx);font-size:15px;outline:none;font-family:inherit}
.search input::placeholder{color:var(--tx3)}
.search .clr{font-size:16px;color:var(--tx3);cursor:pointer;padding:4px;display:none}
.search .clr.on{display:block}
.db-status{margin:0 4px 14px;padding:8px 12px;border-radius:12px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px}
.db-status.online{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#34D399}
.db-status.offline{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#F87171}
.db-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;background:var(--surf);border:1px solid var(--brd);border-radius:20px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--priS);border-color:var(--pri2);color:var(--pri2);font-weight:800}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 12px;gap:10px}
.toolbar .cnt{font-size:13px;color:var(--tx2);font-weight:600}
.toolbar .cnt b{color:var(--tx);font-weight:800}
.sortbtn{padding:8px 14px;background:var(--surf);border:1px solid var(--brd);border-radius:12px;font-size:12px;font-weight:700;color:var(--tx);cursor:pointer;font-family:inherit}
.sortbtn.on{border-color:var(--pri2);color:var(--pri2);background:var(--priS)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--surf);border:1px solid var(--brd);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.pimg{width:100%;aspect-ratio:1;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg .heart{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.pimg .heart.on{color:#EC4899}
.pimg .disc{position:absolute;top:8px;left:8px;background:var(--er);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px}
.pimg .stock-out{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.pinfo{padding:10px}
.pn{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:5px;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prt{display:flex;align-items:center;gap:3px;font-size:11px;margin-bottom:6px}
.prt .st{color:#F59E0B}
.prt .num{color:#F59E0B;font-weight:800}
.prt .cnt{color:var(--tx3)}
.ppr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pp{font-size:15px;font-weight:900;color:var(--pri2)}
.pold{font-size:11px;color:var(--tx3);text-decoration:line-through}
.pshop{font-size:10px;color:var(--wn);font-weight:600;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.padd{width:100%;padding:9px;background:linear-gradient(135deg,#34D399,#10B981);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.padd.incart{background:linear-gradient(135deg,#3B82F6,#2563EB)}
.padd:disabled{opacity:.4;cursor:not-allowed}
.sk{background:linear-gradient(90deg,#151C26 25%,#1E2733 50%,#151C26 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:12px;aspect-ratio:.7}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty .ic{font-size:64px;margin-bottom:14px;opacity:.4}
.empty h3{font-size:16px;font-weight:800;color:var(--tx2);margin-bottom:8px}
.empty p{font-size:13px;line-height:1.6;margin-bottom:16px}
.empty button{background:linear-gradient(135deg,#34D399,#10B981);color:#fff;border:none;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--brd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--safe-b));z-index:100;max-width:640px;margin:0 auto}
.nb{background:none;border:none;color:var(--tx3);font-size:10px;font-weight:600;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;position:relative;font-family:inherit}
.nb.on{color:var(--pri2)}
.nb .ic{font-size:22px}
.nb .cnt{position:absolute;top:0;right:20%;background:var(--er);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surf)}
.tst{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:100px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tst.e{background:var(--er);color:#fff}
.tst.o{background:var(--pri);color:#fff}
</style>
</head>
<body data-t="dark">

<div class="app">
  <div class="hdr">
    <div class="htop">
      <button class="back" onclick="location.href='home.html'">←</button>
      <div class="htitle" id="pageTitle">Qidiruv</div>
      <button class="hbtn" onclick="location.href='cart.html'">🛒<span class="cnt" id="cartCnt" style="display:none">0</span></button>
    </div>
    <div class="search">
      <span class="ic">🔍</span>
      <input type="text" id="q" placeholder="Mahsulot yoki xizmat..." oninput="onSearch(this.value)">
      <span class="clr" id="clrBtn" onclick="clearSearch()">✕</span>
    </div>
  </div>

  <div class="db-status online" id="dbStatus">
    <span class="dot"></span><span id="dbText">Firebase</span>
  </div>

  <div class="chips" id="chips"></div>

  <div class="toolbar">
    <div class="cnt" id="resultCount"><b>0</b> ta natija</div>
    <button class="sortbtn" id="sortBtn" onclick="toggleSort()">
      <span id="sortLabel">💰 Arzon → Qimmat</span>
    </button>
  </div>

  <div id="content">
    <div class="pgrid">
      <div class="sk"></div><div class="sk"></div>
      <div class="sk"></div><div class="sk"></div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nb" onclick="location.href='home.html'"><span class="ic">🏠</span><span>Bosh</span></button>
  <button class="nb on"><span class="ic">🔍</span><span>Qidiruv</span></button>
  <button class="nb" onclick="location.href='kalkulyator.html'"><span class="ic">🧮</span><span>Kalkulyator</span></button>
  <button class="nb" onclick="location.href='cart.html'"><span class="ic">🛒</span><span>Savat</span><span class="cnt" id="navCartCnt" style="display:none">0</span></button>
  <button class="nb" onclick="location.href='profile.html'"><span class="ic">👤</span><span>Profil</span></button>
</div>

<div class="tst" id="tst"></div>

<script>
var CATS=[
  {id:'all',n:'Barchasi',e:'📦'},{id:'oziq',n:'Oziq-ovqat',e:'🍎'},
  {id:'kiyim',n:'Kiyim',e:'👕'},{id:'poyabzal',n:'Poyabzal',e:'👟'},
  {id:'elektr',n:'Elektronika',e:'📱'},{id:'texnika',n:'Texnika',e:'🔌'},
  {id:'mebel',n:'Mebel',e:'🛋'},{id:'qurilish',n:'Qurilish',e:'🧱'},
  {id:'gozal',n:"Go'zallik",e:'💄'},{id:'bola',n:'Bolalar',e:'🧸'},
  {id:'sport',n:'Sport',e:'⚽'},{id:'kitob',n:'Kitob',e:'📚'},
  {id:'kimyo',n:'Kimyo',e:'🧴'},{id:'dori',n:'Dori',e:'💊'},
  {id:'hayvon',n:'Hayvonlar',e:'🐾'}
];

var S={products:[],cart:[],favs:[],q:'',cat:'all',sortAsc:true};

function fmt(n){return Math.round(Number(n)||0).toLocaleString('ru-RU').replace(/,/g,' ')+" so'm";}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,tp){
  var e=document.getElementById('tst');
  e.textContent=m;
  e.className='tst on'+(tp==='e'?' e':tp==='o'?' o':'');
  clearTimeout(e._t);
  e._t=setTimeout(function(){e.className='tst'+(tp==='e'?' e':tp==='o'?' o':'');},2400);
}
function toArray(val){
  if(!val)return[];
  if(Array.isArray(val))return val;
  if(typeof val==='object')return Object.values(val);
  return[];
}

(function(){
  var p=new URLSearchParams(location.search);
  if(p.get('cat'))S.cat=p.get('cat');
  if(p.get('q'))S.q=p.get('q');
})();

function renderChips(){
  var h='';
  CATS.forEach(function(c){
    h+='<div class="chip '+(S.cat===c.id?'on':'')+'" onclick="setCat(\''+c.id+'\')">'+c.e+' '+esc(c.n)+'</div>';
  });
  document.getElementById('chips').innerHTML=h;
}

function setCat(c){
  S.cat=c;
  renderChips();
  render();
  updateURL();
}

function updateURL(){
  var p=new URLSearchParams();
  if(S.cat&&S.cat!=='all')p.set('cat',S.cat);
  if(S.q)p.set('q',S.q);
  var url=location.pathname+(p.toString()?'?'+p.toString():'');
  try{history.replaceState(null,'',url);}catch(e){}
}

function onSearch(v){
  S.q=v.toLowerCase().trim();
  document.getElementById('clrBtn').classList.toggle('on',!!v);
  render();
  updateURL();
}

function clearSearch(){
  document.getElementById('q').value='';
  S.q='';
  document.getElementById('clrBtn').classList.remove('on');
  render();
  updateURL();
}

function toggleSort(){
  S.sortAsc=!S.sortAsc;
  document.getElementById('sortLabel').textContent=S.sortAsc?'💰 Arzon → Qimmat':'💰 Qimmat → Arzon';
  document.getElementById('sortBtn').classList.toggle('on',!S.sortAsc);
  render();
}

function getFiltered(){
  var list=S.products.slice();
  if(S.cat!=='all')list=list.filter(function(p){return p.category===S.cat;});
  if(S.q){
    list=list.filter(function(p){
      return (p.name||'').toLowerCase().indexOf(S.q)!==-1 ||
             (p.shopName||'').toLowerCase().indexOf(S.q)!==-1;
    });
  }
  list.sort(function(a,b){return S.sortAsc?a.price-b.price:b.price-a.price;});
  return list;
}

function isFav(id){return S.favs.indexOf(id)!==-1;}

async function toggleFav(id,ev){
  if(ev)ev.stopPropagation();
  var i=S.favs.indexOf(id);
  if(i===-1){S.favs.push(id);toast('❤️ Saqlandi','o');}
  else{S.favs.splice(i,1);toast('O\'chirildi');}
  await DB.set('favs',S.favs);
  render();
}

function isInCart(id){return S.cart.some(function(c){return String(c.id)===String(id);});}

async function addCart(id,ev){
  if(ev)ev.stopPropagation();
  var p=S.products.find(function(x){return String(x.id)===String(id);});
  if(!p)return toast('Topilmadi','e');
  if(p.stock<=0)return toast('Tugagan','e');
  var ex=S.cart.find(function(c){return String(c.id)===String(id);});
  if(ex)ex.qty=(ex.qty||1)+1;
  else S.cart.push({id:p.id,name:p.name,price:p.price,unit:p.unit||'dona',emoji:p.emoji||'📦',images:p.images||[],shop:p.shopName||'',qty:1});
  await DB.set('cart',S.cart);
  updateCartBadge();
  toast('✅ Savatga qo\'shildi','o');
  render();
}

function updateCartBadge(){
  var cnt=S.cart.reduce(function(s,i){return s+(Number(i.qty)||0);},0);
  ['cartCnt','navCartCnt'].forEach(function(id){
    var el=document.getElementById(id);
    if(!el)return;
    if(cnt>0){el.textContent=cnt>99?'99+':cnt;el.style.display='flex';}
    else el.style.display='none';
  });
}

function render(){
  var list=getFiltered();
  document.getElementById('resultCount').innerHTML='<b>'+list.length+'</b> ta natija';
  var catObj=CATS.find(function(c){return c.id===S.cat;});
  if(S.cat!=='all'&&catObj)document.getElementById('pageTitle').textContent=catObj.e+' '+catObj.n;
  else document.getElementById('pageTitle').textContent='Qidiruv';
  var c=document.getElementById('content');
  if(!list.length){
    c.innerHTML='<div class="empty"><div class="ic">🔍</div><h3>Hech narsa topilmadi</h3><p>Boshqa so\'z bilan qidirib ko\'ring</p><button onclick="resetAll()">🔄 Boshidan</button></div>';
    return;
  }
  var h='<div class="pgrid">';
  list.forEach(function(p){h+=card(p);});
  h+='</div>';
  c.innerHTML=h;
}

function card(p){
  var inCart=isInCart(p.id);
  var fav=isFav(p.id);
  var disc=p.oldPrice&&p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
  var rt=p.rt||5,rc=p.rc||0;
  var ratingHtml=rc>0?'<div class="prt"><span class="st">⭐</span><span class="num">'+Number(rt).toFixed(1)+'</span><span class="cnt">('+rc+')</span></div>':'<div class="prt"><span style="color:var(--tx3)">☆☆☆☆☆ Sharh yo\'q</span></div>';
  var oldPrice=p.oldPrice&&p.oldPrice>p.price?'<span class="pold">'+fmt(p.oldPrice)+'</span>':'';
  var discBadge=disc>0?'<div class="disc">-'+disc+'%</div>':'';
  var outStock=p.stock<=0?'<div class="stock-out">Tugagan</div>':'';
  var img=p.images&&p.images[0]?'<img src="'+p.images[0]+'">':(p.emoji||'📦');
  return '<div class="pcard" onclick="location.href=\'product.html?id='+p.id+'\'">'+
    '<div class="pimg">'+img+discBadge+
      '<div class="heart '+(fav?'on':'')+'" onclick="event.stopPropagation();toggleFav(\''+p.id+'\',event)">'+(fav?'❤️':'🤍')+'</div>'+outStock+
    '</div>'+
    '<div class="pinfo">'+
      '<div class="pn">'+esc(p.name)+'</div>'+ratingHtml+
      '<div class="ppr"><span class="pp">'+fmt(p.price)+'</span>'+oldPrice+'</div>'+
      (p.shopName?'<div class="pshop">🏪 '+esc(p.shopName)+'</div>':'')+
      '<button class="padd '+(inCart?'incart':'')+'" onclick="event.stopPropagation();addCart(\''+p.id+'\',event)" '+(p.stock<=0?'disabled':'')+'>'+
      (p.stock<=0?'❌ Tugagan':(inCart?'✅ Savatda':'🛒 Savatga'))+'</button>'+
    '</div>'+
  '</div>';
}

function resetAll(){
  S.q='';S.cat='all';
  document.getElementById('q').value='';
  document.getElementById('clrBtn').classList.remove('on');
  renderChips();
  render();
  updateURL();
}

function setupListeners(){
  DB.on('products',function(val){
    S.products=toArray(val).filter(function(p){return p&&p.name;});
    render();
  });
  DB.on('cart',function(val){
    S.cart=toArray(val);
    updateCartBadge();
    render();
  });
  DB.on('favs',function(val){
    S.favs=toArray(val);
    render();
  });
}

function init(){
  var th=DB.get('theme','dark');
  document.body.dataset.t=th;
  document.getElementById('q').value=S.q;
  if(S.q)document.getElementById('clrBtn').classList.add('on');
  renderChips();
  S.cart=toArray(DB.get('cart',[]));
  S.favs=toArray(DB.get('favs',[]));
  updateCartBadge();
  if(DB.isReady())onReady();
  else{
    window.addEventListener('db:ready',onReady);
    setTimeout(function(){
      if(!S.products.length)loadLocal();
    },3000);
  }
  window.addEventListener('db:connection',function(e){
    var el=document.getElementById('dbStatus');
    var t=document.getElementById('dbText');
    if(e.detail.online){el.className='db-status online';t.textContent='🟢 Online';}
    else{el.className='db-status offline';t.textContent='🔴 Offline';}
  });
}

function onReady(){
  document.getElementById('dbStatus').className='db-status online';
  document.getElementById('dbText').textContent='🟢 Online — real-time';
  DB.syncAll().then(function(){
    var products=DB.get('products',[]);
    S.products=toArray(products).filter(function(p){return p&&p.name;});
    if(!S.products.length)loadLocal();
    else{
      setupListeners();
      render();
    }
  });
}

function loadLocal(){
  try{
    var old=JSON.parse(localStorage.getItem('rayis_products')||'[]');
    if(Array.isArray(old)&&old.length)S.products=old.filter(function(p){return p&&p.name;});
  }catch(e){}
  setupListeners();
  render();
}

init();
console.log('✅ Search sahifasi tayyor');
</script>
</body>
</html>
